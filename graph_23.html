<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elastic Spring Lattice • Real-time Stretch</title>
    <style>
        body { margin:0; overflow:hidden; background:#0a0a0a; font-family:Arial,sans-serif; }
        canvas { display:block; }
        #controls {
            position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.85);
            padding:12px 16px; border-radius:10px; color:white; z-index:100;
        }
        #info {
            position:absolute; bottom:15px; left:15px; background:rgba(0,0,0,0.7);
            color:#00ffff; padding:8px 14px; border-radius:6px; font-size:13px;
            opacity:0; transition:opacity 0.3s; pointer-events:none;
        }
    </style>
</head>
<body>
    <div id="controls">
        <label>N: <input type="number" id="nInput" value="7" min="3" max="12"></label>
        <button onclick="generateLattice()">Generate Lattice</button>
        <small style="display:block;margin-top:8px;">
            Drag background = rotate<br>
            Drag a node = pull it (edges stretch live!)<br>
            Release = continuous spring relaxation
        </small>
    </div>
    <div id="info">Dragging node • edges stretching live</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
        const PHYSICS = {
            springK: 3200,
            damping: 0.92,
            maxVel: 25,
            subSteps: 3
        };

        let scene, camera, renderer, latticeGroup, lineSegments;
        let nodeMeshes = [], nodePositions = [], originalPositions = [], velocities = [];
        let adjacency = [], edges = [], restLengths = [];
        let isDragging = false, isDraggingNode = false, selectedNode = -1;
        let rotX = 0.3, rotY = 0.6;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(20, 25, 50);

            renderer = new THREE.WebGLRenderer({antialias:true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dir = new THREE.DirectionalLight(0xffffff, 1.1);
            dir.position.set(30, 40, 30);
            scene.add(dir);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            setupControls();
            generateLattice();
            animate();
        }

        function generateLattice() {
            if (latticeGroup) scene.remove(latticeGroup);
            latticeGroup = new THREE.Group();

            nodeMeshes = []; nodePositions = []; originalPositions = []; velocities = [];
            adjacency = []; edges = []; restLengths = [];

            const n = parseInt(document.getElementById('nInput').value) || 7;
            const edgeLen = 3.2;
            const points = [];

            for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) for (let k = 0; k < n; k++) {
                const x = (i - (n-1)/2) * edgeLen * 1.1;
                const y = (j - (n-1)/2) * edgeLen * 0.95;
                const z = (k - (n-1)/2) * edgeLen * 1.1;
                points.push(new THREE.Vector3(x, y, z));
            }

            points.forEach(p => {
                nodePositions.push(p.clone());
                originalPositions.push(p.clone());
                velocities.push(new THREE.Vector3());
                adjacency.push([]);
            });

            for (let i = 0; i < points.length; i++) {
                for (let j = i+1; j < points.length; j++) {
                    const d = nodePositions[i].distanceTo(nodePositions[j]);
                    if (d < edgeLen * 1.75 && d > 0.1) {
                        adjacency[i].push(j);
                        adjacency[j].push(i);
                        edges.push([i, j]);
                    }
                }
            }

            restLengths = edges.map(([a,b]) => nodePositions[a].distanceTo(nodePositions[b]));

            const nodeGeo = new THREE.SphereGeometry(0.25, 24, 24);
            const nodeMat = new THREE.MeshPhongMaterial({color: 0xffffff, emissive: 0x44ffff, shininess: 90});
            nodePositions.forEach((pos, i) => {
                const mesh = new THREE.Mesh(nodeGeo, nodeMat.clone());
                mesh.position.copy(pos);
                mesh.userData.index = i;
                latticeGroup.add(mesh);
                nodeMeshes.push(mesh);
            });

            const lineGeo = new THREE.BufferGeometry();
            lineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(edges.length * 6), 3));
            lineSegments = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
                color: 0x00ffff, transparent: true, opacity: 0.85
            }));
            latticeGroup.add(lineSegments);

            updateLines();
            scene.add(latticeGroup);

            camera.position.set(0, 0, n * 5);
            camera.lookAt(0, 0, 0);
            latticeGroup.rotation.set(rotX, rotY, 0);
        }

        function updateLines() {
            const arr = lineSegments.geometry.attributes.position.array;
            let idx = 0;
            edges.forEach(([a,b]) => {
                const p1 = nodePositions[a], p2 = nodePositions[b];
                arr[idx++] = p1.x; arr[idx++] = p1.y; arr[idx++] = p1.z;
                arr[idx++] = p2.x; arr[idx++] = p2.y; arr[idx++] = p2.z;
            });
            lineSegments.geometry.attributes.position.needsUpdate = true;
        }

        function updatePhysics(dt = 0.016) {
            const forces = nodePositions.map(() => new THREE.Vector3());

            edges.forEach(([a, b], i) => {
                const rest = restLengths[i];
                const delta = new THREE.Vector3().subVectors(nodePositions[b], nodePositions[a]);
                const len = delta.length() || 1;
                const dir = delta.divideScalar(len);

                const forceMag = PHYSICS.springK * (len - rest);
                const f = dir.multiplyScalar(forceMag);
                forces[a].add(f);
                forces[b].sub(f);
            });

            for (let i = 0; i < nodePositions.length; i++) {
                if (i === selectedNode) continue;   // dragged node is mouse-controlled

                const v = velocities[i];
                v.addScaledVector(forces[i], dt);
                v.multiplyScalar(PHYSICS.damping);
                if (v.length() > PHYSICS.maxVel) v.setLength(PHYSICS.maxVel);

                nodePositions[i].addScaledVector(v, dt);
                nodeMeshes[i].position.copy(nodePositions[i]);
            }

            updateLines();
        }

        function setupControls() {
            const canvas = renderer.domElement;

            canvas.addEventListener('mousedown', e => {
                if (e.button !== 0) return;
                isDragging = true;

                const rect = canvas.getBoundingClientRect();
                mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const hits = raycaster.intersectObjects(nodeMeshes);

                if (hits.length > 0) {
                    isDraggingNode = true;
                    selectedNode = hits[0].object.userData.index;
                    document.getElementById('info').style.opacity = 1;
                    document.getElementById('info').textContent = "Dragging • edges stretching live";
                }
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
                if (isDraggingNode) {
                    isDraggingNode = false;
                    selectedNode = -1;
                    document.getElementById('info').style.opacity = 0;
                }
            });

            window.addEventListener('mousemove', e => {
                if (!isDragging) return;

                if (isDraggingNode && selectedNode !== -1) {
                    const rect = renderer.domElement.getBoundingClientRect();
                    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

                    raycaster.setFromCamera(mouse, camera);
                    const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(
                        camera.getWorldDirection(new THREE.Vector3()),
                        nodePositions[selectedNode]
                    );

                    const intersect = new THREE.Vector3();
                    if (raycaster.ray.intersectPlane(plane, intersect)) {
                        nodePositions[selectedNode].copy(intersect);
                        nodeMeshes[selectedNode].position.copy(intersect);
                        updateLines();           // ← important: update edges while dragging
                    }
                } else {
                    rotY += e.movementX * 0.0045;
                    rotX += e.movementY * 0.0045;
                    rotX = Math.max(-1.5, Math.min(1.5, rotX));
                    latticeGroup.rotation.set(rotX, rotY, 0);
                }
            });

            window.addEventListener('wheel', e => {
                camera.position.z += e.deltaY * 0.12;
                camera.position.z = Math.max(15, Math.min(180, camera.position.z));
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!isDraggingNode) {
                for (let i = 0; i < PHYSICS.subSteps; i++) {
                    updatePhysics(0.016 / PHYSICS.subSteps);
                }
                if (!isDragging) latticeGroup.rotation.y += 0.0004;
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
