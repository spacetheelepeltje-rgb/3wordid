<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tetrahedrons Graph</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: Arial, sans-serif; }
        canvas { display: block; }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 12px 15px;
            border-radius: 10px;
            color: white;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        label { font-size: 14px; }
        input[type="number"] {
            width: 70px;
            padding: 6px;
            border: none;
            border-radius: 4px;
            background: #222;
            color: white;
            text-align: center;
        }
        button {
            padding: 8px 16px;
            background: #00ccff;
            color: #111;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #00ffff; }
        small { font-size: 12px; opacity: 0.8; }
    </style>
</head>
<body>
    <div id="controls">
        <label>Number of Tetrahedrons (N):</label>
        <input type="number" id="nInput" value="10" min="1" max="100">
        <button onclick="generateScene()">Generate</button>
        <small>Drag mouse to rotate • Scroll to zoom • Auto-rotates when idle</small>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let modelGroup;
        let isDragging = false;
        let previousMouseX = 0;
        let previousMouseY = 0;
        let rotationX = 0.3;
        let rotationY = 0;
        let currentN = 10;

        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 35);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Lighting for nice depth
            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(15, 25, 20);
            scene.add(dirLight);

            window.addEventListener('resize', onResize);
            setupMouseControls(renderer.domElement);

            animate();
        }

        function createRegularTetrahedron(center, edgeLength = 3.5) {
            const group = new THREE.Group();

            // Regular tetrahedron vertices (scaled to exact edge length)
            const s = edgeLength / (2 * Math.sqrt(2));
            const v0 = new THREE.Vector3( s,  s,  s);
            const v1 = new THREE.Vector3( s, -s, -s);
            const v2 = new THREE.Vector3(-s,  s, -s);
            const v3 = new THREE.Vector3(-s, -s,  s);

            const vertices = [v0, v1, v2, v3];

            // 6 edges
            const edgePairs = [
                [0,1], [0,2], [0,3],
                [1,2], [1,3], [2,3]
            ];

            const positions = [];
            edgePairs.forEach(([a, b]) => {
                const pA = vertices[a].clone().add(center);
                const pB = vertices[b].clone().add(center);
                positions.push(pA.x, pA.y, pA.z);
                positions.push(pB.x, pB.y, pB.z);
            });

            // Wireframe edges (the "graph")
            const lineGeo = new THREE.BufferGeometry();
            lineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
            const lineMat = new THREE.LineBasicMaterial({
                color: 0x00ffff,
                linewidth: 4
            });
            const lines = new THREE.LineSegments(lineGeo, lineMat);
            group.add(lines);

            // Optional transparent faces for solid 3D look
            const faceVertices = [];
            // Four triangular faces
            const faces = [[0,1,2], [0,1,3], [0,2,3], [1,2,3]];
            faces.forEach(face => {
                face.forEach(i => {
                    const p = vertices[i].clone().add(center);
                    faceVertices.push(p.x, p.y, p.z);
                });
            });
            const faceGeo = new THREE.BufferGeometry();
            faceGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(faceVertices), 3));
            const faceMat = new THREE.MeshPhongMaterial({
                color: 0x0088ff,
                transparent: true,
                opacity: 0.65,
                side: THREE.DoubleSide,
                shininess: 30
            });
            const facesMesh = new THREE.Mesh(faceGeo, faceMat);
            group.add(facesMesh);

            // Small spheres at vertices (nodes of the graph)
            const nodeGeo = new THREE.SphereGeometry(0.18, 24, 24);
            const nodeMat = new THREE.MeshPhongMaterial({ color: 0xffffff, emissive: 0x00ffff, shininess: 100 });
            vertices.forEach(v => {
                const node = new THREE.Mesh(nodeGeo, nodeMat);
                node.position.copy(v).add(center);
                group.add(node);
            });

            return group;
        }

        function generateScene() {
            if (modelGroup) scene.remove(modelGroup);

            modelGroup = new THREE.Group();
            currentN = Math.max(1, Math.min(100, parseInt(document.getElementById('nInput').value) || 10));

            const edgeLength = 3.5;
            const spacing = edgeLength * 2.8;           // fixed spacing so tetrahedrons don't overlap
            const totalWidth = (currentN - 1) * spacing;

            for (let i = 0; i < currentN; i++) {
                const x = i * spacing - totalWidth / 2;
                const center = new THREE.Vector3(x, 0, 0);

                // Cycle through vibrant colors
                const hue = (i * 360 / currentN) % 360;
                const tetraGroup = createRegularTetrahedron(center, edgeLength);

                // Tint the edges and faces slightly per tetrahedron
                tetraGroup.children.forEach(child => {
                    if (child.material && child.material.color) {
                        child.material.color.setHSL(hue / 360, 1, 0.75);
                    }
                });

                modelGroup.add(tetraGroup);
            }

            scene.add(modelGroup);

            // Dynamically adjust camera distance so everything stays visible and centered
            const requiredDistance = Math.max(20, totalWidth * 0.75 + 18);
            camera.position.set(0, requiredDistance * 0.35, requiredDistance);
            camera.lookAt(0, 0, 0);

            // Reset rotation for fresh view
            rotationX = 0.3;
            rotationY = 0;
            modelGroup.rotation.set(rotationX, rotationY, 0);
        }

        function setupMouseControls(canvas) {
            // Drag to rotate
            canvas.addEventListener('mousedown', e => {
                if (e.button === 0) {
                    isDragging = true;
                    previousMouseX = e.clientX;
                    previousMouseY = e.clientY;
                }
            });

            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mouseleave', () => isDragging = false);

            window.addEventListener('mousemove', e => {
                if (!isDragging || !modelGroup) return;

                const deltaX = (e.clientX - previousMouseX) * 0.0045;
                const deltaY = (e.clientY - previousMouseY) * 0.0045;

                rotationY += deltaX;
                rotationX += deltaY;
                rotationX = Math.max(-1.4, Math.min(1.4, rotationX)); // prevent flipping upside-down

                modelGroup.rotation.set(rotationX, rotationY, 0);

                previousMouseX = e.clientX;
                previousMouseY = e.clientY;
            });

            // Mouse wheel zoom
            window.addEventListener('wheel', e => {
                if (!camera) return;
                camera.position.z += e.deltaY * 0.08;
                camera.position.z = Math.max(12, Math.min(camera.position.z, 120));
            });
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (modelGroup && !isDragging) {
                modelGroup.rotation.y += 0.0008; // gentle idle rotation
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        // Launch everything
        window.onload = () => {
            initThree();
            generateScene(); // initial scene with N=10
        };
    </script>
</body>
</html>
