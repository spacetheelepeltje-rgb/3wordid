<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Earth Shell - Clean Triangular Network (550 km)</title>
<style>
  body { margin:0; overflow:hidden; background:#000; font-family:Arial, sans-serif; }
  
  #controls {
    position: absolute; 
    top: 15px; 
    left: 50%; 
    transform: translateX(-50%);
    color: white; 
    background: rgba(0,0,0,0.85);
    padding: 18px 25px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 20px;
    z-index: 100;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
  }
  
  #controls label { font-size: 16px; font-weight: bold; }
  #controls input { width: 130px; padding: 10px; font-size: 16px; border-radius: 6px; }
  #controls button {
    padding: 12px 22px;
    font-size: 16px;
    font-weight: bold;
    background: #00aaff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  #controls button:hover { background: #00ccff; }

  #info {
    position: absolute; 
    top: 90px; 
    left: 20px; 
    color: white; 
    background: rgba(0,0,0,0.65);
    padding: 12px; 
    border-radius: 8px; 
    font-size: 14px;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="controls">
  <label>Triangle Area (sq miles):</label>
  <input type="number" id="areaInput" value="500">
  
  <button onclick="updateShell()">Update Network</button>
  <button onclick="toggleRotation()">Pause Rotation</button>
</div>

<div id="info">
  <strong>Earth + 550 km Triangular Shell</strong><br>
  <span id="stats"></span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>

<script>
// ============== CONFIG ==============
const EARTH_RADIUS_KM = 6371;
const ALTITUDE_KM = 550;
const SHELL_RADIUS_KM = EARTH_RADIUS_KM + ALTITUDE_KM;

const SCALE = 0.001;
const EARTH_RADIUS = EARTH_RADIUS_KM * SCALE;
const SHELL_RADIUS = SHELL_RADIUS_KM * SCALE;

let triangleAreaSqMiles = 500;
let rotating = true;

// ============== THREE.JS SETUP ==============
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 6, 20);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

scene.add(new THREE.AmbientLight(0x404060));
const sunLight = new THREE.DirectionalLight(0xffffff, 1.3);
sunLight.position.set(30, 40, 50);
scene.add(sunLight);

// ============== EARTH ==============
const earth = new THREE.Mesh(
  new THREE.SphereGeometry(EARTH_RADIUS, 64, 64),
  new THREE.MeshPhongMaterial({ color: 0x1e4a8f, shininess: 8 })
);
scene.add(earth);

scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(EARTH_RADIUS * 1.018, 64, 64),
  new THREE.MeshPhongMaterial({ color: 0x88ccff, transparent: true, opacity: 0.12, side: THREE.BackSide })
));

// ============== SHELL ==============
let shellGroup = new THREE.Group();
scene.add(shellGroup);

function createShell() {
  shellGroup.clear();

  const areaSqKm = triangleAreaSqMiles * 2.58999;
  const shellSurfaceArea = 4 * Math.PI * SHELL_RADIUS_KM ** 2;
  let numPoints = Math.floor(shellSurfaceArea / areaSqKm);
  numPoints = Math.max(120, Math.min(numPoints, 8500));

  // Fibonacci spiral points
  const points = [];
  const golden = Math.PI * (3 - Math.sqrt(5));

  for (let i = 0; i < numPoints; i++) {
    const y = 1 - (i / (numPoints - 1)) * 2;
    const radius = Math.sqrt(1 - y * y);
    const theta = golden * i;

    const x = Math.cos(theta) * radius;
    const z = Math.sin(theta) * radius;
    
    points.push(new THREE.Vector3(x, y, z).multiplyScalar(SHELL_RADIUS));
  }

  // Very small nodes (just dots)
  const nodeSize = 0.018;
  const nodeGeo = new THREE.SphereGeometry(nodeSize, 10, 10);
  const nodeMat = new THREE.MeshPhongMaterial({ color: 0x00ffdd, emissive: 0x00ffcc });
  const nodes = new THREE.InstancedMesh(nodeGeo, nodeMat, numPoints);
  
  const dummy = new THREE.Object3D();
  points.forEach((pos, i) => {
    dummy.position.copy(pos);
    dummy.updateMatrix();
    nodes.setMatrixAt(i, dummy.matrix);
  });
  shellGroup.add(nodes);

  // Improved connection algorithm: each point connects to nearest neighbors (cleaner triangles)
  const connections = [];
  const k = 6; // connect to 6 nearest neighbors (good for triangular feel)

  for (let i = 0; i < numPoints; i++) {
    const neighbors = [];

    for (let j = 0; j < numPoints; j++) {
      if (i === j) continue;
      const dist = points[i].distanceTo(points[j]);
      neighbors.push({ index: j, dist });
    }

    neighbors.sort((a, b) => a.dist - b.dist);
    
    for (let n = 0; n < Math.min(k, neighbors.length); n++) {
      const neighbor = neighbors[n];
      if (neighbor.index > i) { // avoid duplicate lines
        connections.push(points[i]);
        connections.push(points[neighbor.index]);
      }
    }
  }

  const lineGeo = new THREE.BufferGeometry().setFromPoints(connections);
  const lineMat = new THREE.LineBasicMaterial({ 
    color: 0x00ffcc, 
    transparent: true, 
    opacity: 0.65 
  });
  const lines = new THREE.LineSegments(lineGeo, lineMat);
  shellGroup.add(lines);

  // Very faint spherical shell for context
  const faceMat = new THREE.MeshBasicMaterial({
    color: 0x00ffaa,
    transparent: true,
    opacity: 0.04,
    side: THREE.DoubleSide
  });
  shellGroup.add(new THREE.Mesh(
    new THREE.SphereGeometry(SHELL_RADIUS, 48, 48), 
    faceMat
  ));

  document.getElementById('stats').innerHTML = `
    Altitude: 550 km<br>
    Nodes: ${numPoints.toLocaleString()}<br>
    Edges: ${(connections.length/2).toLocaleString()}<br>
    Area per triangle ≈ ${triangleAreaSqMiles} sq miles
  `;
}

// ============== ANIMATION ==============
function animate() {
  requestAnimationFrame(animate);
  controls.update();

  if (rotating) {
    earth.rotation.y += 0.0005;
    shellGroup.rotation.y += 0.0005;
  }
  renderer.render(scene, camera);
}
animate();

// ============== CONTROLS ==============
window.updateShell = function() {
  triangleAreaSqMiles = parseFloat(document.getElementById('areaInput').value) || 500;
  createShell();
};

window.toggleRotation = function() {
  rotating = !rotating;
  const btn = document.querySelectorAll('#controls button')[1];
  btn.textContent = rotating ? "Pause Rotation" : "Resume Rotation";
};

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Initial
createShell();
</script>
</body>
</html>
