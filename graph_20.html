<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetrahedral Lattice • Edge Collapse Propagation</title>
    <style>
        body { margin:0; overflow:hidden; background:#0a0a0a; }
        canvas { display:block; }
        #controls {
            position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.8);
            padding:12px 16px; border-radius:10px; color:white; z-index:100;
        }
        #info {
            position:absolute; bottom:15px; left:15px; background:rgba(0,0,0,0.7);
            color:#00ffff; padding:8px 14px; border-radius:6px; font-size:13px;
            opacity:0; transition:opacity 0.3s; pointer-events:none;
        }
    </style>
</head>
<body>
    <div id="controls">
        <label>N: <input type="number" id="n" value="7" min="3" max="12"></label>
        <button onclick="generate()">Generate Lattice</button>
        <small style="display:block;margin-top:8px;">Drag to rotate • Scroll to zoom • Click any node</small>
    </div>
    <div id="info">Chain collapse propagating...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
        let scene, camera, renderer, latticeGroup, lineSegments;
        let nodeMeshes = [], nodePositions = [], originalPositions = [], velocities = [];
        let adjacency = [], edges = [], restLengths = [];
        let isDragging = false, rotX = 0.4, rotY = 0.2;
        let animating = false, returnPhase = false, returnStartTime = 0;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(20, 22, 45);

            renderer = new THREE.WebGLRenderer({antialias: true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const d = new THREE.DirectionalLight(0xffffff, 1.1);
            d.position.set(30, 40, 30);
            scene.add(d);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            setupMouse();
            generate();
            animate();
        }

        function generate() {
            if (latticeGroup) scene.remove(latticeGroup);
            latticeGroup = new THREE.Group();

            nodeMeshes = []; nodePositions = []; originalPositions = []; velocities = [];
            adjacency = []; edges = []; restLengths = [];

            const n = parseInt(document.getElementById('n').value) || 7;
            const edgeLen = 3.2;
            const points = [];

            for (let i = 0; i < n; i++) {
                for (let j = 0; j < n; j++) {
                    for (let k = 0; k < n; k++) {
                        const x = (i - (n-1)/2) * edgeLen * 1.1;
                        const y = (j - (n-1)/2) * edgeLen * 0.95;
                        const z = (k - (n-1)/2) * edgeLen * 1.1;
                        points.push(new THREE.Vector3(x, y, z));
                    }
                }
            }

            points.forEach(p => {
                nodePositions.push(p.clone());
                originalPositions.push(p.clone());
                velocities.push(new THREE.Vector3());
                adjacency.push([]);
            });

            // Build tetrahedral-style connections
            for (let i = 0; i < points.length; i++) {
                for (let j = i+1; j < points.length; j++) {
                    const d = nodePositions[i].distanceTo(nodePositions[j]);
                    if (d < edgeLen * 1.75 && d > 0.1) {
                        adjacency[i].push(j);
                        adjacency[j].push(i);
                        edges.push([i, j]);
                    }
                }
            }

            restLengths = edges.map(([a,b]) => nodePositions[a].distanceTo(nodePositions[b]));

            // Nodes
            const nodeGeo = new THREE.SphereGeometry(0.25, 24, 24);
            const nodeMat = new THREE.MeshPhongMaterial({color: 0xffffff, emissive: 0x44ffff, shininess: 80});
            nodePositions.forEach((pos, i) => {
                const mesh = new THREE.Mesh(nodeGeo, nodeMat.clone());
                mesh.position.copy(pos);
                mesh.userData.index = i;
                latticeGroup.add(mesh);
                nodeMeshes.push(mesh);
            });

            // Edges
            const lineGeo = new THREE.BufferGeometry();
            lineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(edges.length * 6), 3));
            lineSegments = new THREE.LineSegments(lineGeo, 
                new THREE.LineBasicMaterial({color: 0x00ffff, transparent: true, opacity: 0.85}));
            latticeGroup.add(lineSegments);

            updateLines();
            scene.add(latticeGroup);

            camera.position.set(0, 0, n * 4.8);
            camera.lookAt(0,0,0);
            latticeGroup.rotation.set(rotX, rotY, 0);
        }

        function updateLines() {
            const arr = lineSegments.geometry.attributes.position.array;
            let idx = 0;
            edges.forEach(([a,b]) => {
                const p1 = nodePositions[a], p2 = nodePositions[b];
                arr[idx++] = p1.x; arr[idx++] = p1.y; arr[idx++] = p1.z;
                arr[idx++] = p2.x; arr[idx++] = p2.y; arr[idx++] = p2.z;
            });
            lineSegments.geometry.attributes.position.needsUpdate = true;
        }

        function updatePhysics(dt = 0.016) {
            const forces = nodePositions.map(() => new THREE.Vector3());
            const spring = 1650;
            const damp = 0.93;

            // Stretch-only springs (edges pull when stretched)
            edges.forEach(([a,b], i) => {
                const rest = restLengths[i];
                const delta = new THREE.Vector3().subVectors(nodePositions[b], nodePositions[a]);
                const len = delta.length() || 1;
                const dir = delta.divideScalar(len);

                if (len > rest * 1.02) {
                    const f = dir.multiplyScalar(spring * (len - rest));
                    forces[a].add(f);
                    forces[b].sub(f);
                }
            });

            // Apply forces + momentum
            for (let i = 0; i < nodePositions.length; i++) {
                velocities[i].addScaledVector(forces[i], dt);
                velocities[i].multiplyScalar(damp);
                if (velocities[i].length() > 14) velocities[i].setLength(14);

                nodePositions[i].addScaledVector(velocities[i], dt);
                nodeMeshes[i].position.copy(nodePositions[i]);
            }
            updateLines();
        }

        function startChainCollapse(startIndex) {
            if (animating) return;
            animating = true;
            returnPhase = false;

            let current = startIndex;
            const chain = [];
            const visited = new Set([current]);

            // Build chain (up to 8 steps)
            for (let i = 0; i < 8; i++) {
                const neighbors = adjacency[current].filter(n => !visited.has(n));
                if (!neighbors.length) break;
                const next = neighbors[Math.floor(Math.random() * neighbors.length)];
                chain.push({from: current, to: next});
                visited.add(next);
                current = next;
            }

            if (chain.length === 0) { animating = false; return; }

            document.getElementById('info').style.opacity = 1;
            document.getElementById('info').textContent = `Collapse chain: ${chain.length} steps`;

            // Sequential visible collapses
            chain.forEach((step, index) => {
                setTimeout(() => {
                    if (!animating) return;
                    const dir = new THREE.Vector3().subVectors(nodePositions[step.to], nodePositions[step.from]).normalize();
                    
                    // Pull node almost to neighbor (visible collapse)
                    nodePositions[step.from].lerp(nodePositions[step.to], 0.94);
                    nodeMeshes[step.from].position.copy(nodePositions[step.from]);

                    // Strong momentum in the direction of collapse
                    velocities[step.from].addScaledVector(dir, 14);
                    velocities[step.to].addScaledVector(dir, -4);

                    // Highlight the collapsing node
                    nodeMeshes.forEach(m => m.material.emissive.setHex(0x44ffff));
                    nodeMeshes[step.from].material.emissive.setHex(0xff0088);
                }, index * 80); // 80ms per step → clear propagation
            });

            // After chain finishes, let physics run then return to original
            setTimeout(() => {
                if (!animating) return;
                returnPhase = true;
                returnStartTime = Date.now();
            }, chain.length * 80 + 1200);
        }

        function updateReturn() {
            const t = Math.min(1, (Date.now() - returnStartTime) / 1800); // 1.8 seconds return
            const ease = 1 - Math.pow(1 - t, 3);

            for (let i = 0; i < nodePositions.length; i++) {
                const toOriginal = new THREE.Vector3().subVectors(originalPositions[i], nodePositions[i]);
                velocities[i].addScaledVector(toOriginal, 60 * ease);
                // Gentle damping
                velocities[i].multiplyScalar(0.88);
            }

            updatePhysics(0.016);

            if (t >= 1) {
                animating = false;
                returnPhase = false;
                document.getElementById('info').style.opacity = 0;
                // Final cleanup
                nodeMeshes.forEach(m => {
                    m.material.emissive.setHex(0x44ffff);
                    m.material.emissiveIntensity = 0.6;
                });
            }
        }

        function setupMouse() {
            const canvas = renderer.domElement;

            canvas.addEventListener('mousedown', e => { if (e.button === 0) isDragging = true; });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', e => {
                if (!isDragging) return;
                rotY += e.movementX * 0.0045;
                rotX += e.movementY * 0.0045;
                rotX = Math.max(-1.5, Math.min(1.5, rotX));
                latticeGroup.rotation.set(rotX, rotY, 0);
            });

            canvas.addEventListener('click', e => {
                if (animating) return;

                const rect = canvas.getBoundingClientRect();
                const mouse = new THREE.Vector2(
                    ((e.clientX - rect.left) / rect.width) * 2 - 1,
                    -((e.clientY - rect.top) / rect.height) * 2 + 1
                );

                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(mouse, camera);
                const hits = raycaster.intersectObjects(nodeMeshes);
                if (hits.length > 0) {
                    startChainCollapse(hits[0].object.userData.index);
                }
            });

            window.addEventListener('wheel', e => {
                if (animating) return;
                camera.position.z += e.deltaY * 0.12;
                camera.position.z = Math.max(15, Math.min(160, camera.position.z));
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!isDragging && !animating) latticeGroup.rotation.y += 0.0005;

            if (animating) {
                if (returnPhase) {
                    updateReturn();
                } else {
                    updatePhysics(0.016);
                }
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
