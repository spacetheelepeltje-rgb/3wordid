<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetrahedral Lattice • Pure Edge-Driven Physics</title>
    <style>
        body { margin:0; overflow:hidden; background:#0a0a0a; font-family:Arial,sans-serif; }
        canvas { display:block; }
        #controls {
            position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.8);
            padding:12px 16px; border-radius:10px; color:white; z-index:100;
        }
        #info {
            position:absolute; bottom:15px; left:15px; background:rgba(0,0,0,0.7);
            color:#00ffff; padding:8px 14px; border-radius:6px; font-size:13px;
            opacity:0; transition:opacity 0.3s; pointer-events:none;
        }
    </style>
</head>
<body>
    <div id="controls">
        <label>N: <input type="number" id="n" value="7" min="3" max="12"></label>
        <button onclick="generate()">Generate Lattice</button>
        <small style="display:block;margin-top:8px;">Drag to rotate • Scroll to zoom • Click any node to start edge-collapse chain</small>
    </div>
    <div id="info">Edge-collapse chain propagating...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
        // ====================== PHYSICS PARAMETERS (easy to tweak) ======================
        const PHYSICS = {
            springK: 1650,           // stiffness of edges (higher = stiffer)
            damping: 0.93,           // velocity damping
            maxVelocity: 14,         // prevent explosion
            collapseImpulse: 14,     // strength of collapse pull
            returnStrength: 550,      // gentle force pulling back to original lattice
            returnDuration: 50     // ms for full return
        };

        // ====================== CORE THREE.JS SETUP ======================
        let scene, camera, renderer, latticeGroup, lineSegments;
        let nodeMeshes = [], nodePositions = [], originalPositions = [], velocities = [];
        let adjacency = [], edges = [], restLengths = [];
        let isDragging = false, rotX = 0.4, rotY = 0.2;
        let animating = false, returnStartTime = 0;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(20, 22, 45);

            renderer = new THREE.WebGLRenderer({antialias: true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
            dirLight.position.set(30, 40, 30);
            scene.add(dirLight);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            setupMouse();
            generate();
            animate();
        }

        // ====================== LATTICE GENERATION ======================
        function generate() {
            if (latticeGroup) scene.remove(latticeGroup);
            latticeGroup = new THREE.Group();

            nodeMeshes = []; nodePositions = []; originalPositions = []; velocities = [];
            adjacency = []; edges = []; restLengths = [];

            const n = parseInt(document.getElementById('n').value) || 7;
            const edgeLen = 3.2;
            const points = [];

            for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) for (let k = 0; k < n; k++) {
                const x = (i - (n-1)/2) * edgeLen * 1.1;
                const y = (j - (n-1)/2) * edgeLen * 0.95;
                const z = (k - (n-1)/2) * edgeLen * 1.1;
                points.push(new THREE.Vector3(x, y, z));
            }

            points.forEach(p => {
                nodePositions.push(p.clone());
                originalPositions.push(p.clone());
                velocities.push(new THREE.Vector3());
                adjacency.push([]);
            });

            // Build connections
            for (let i = 0; i < points.length; i++) {
                for (let j = i+1; j < points.length; j++) {
                    const d = nodePositions[i].distanceTo(nodePositions[j]);
                    if (d < edgeLen * 1.75 && d > 0.1) {
                        adjacency[i].push(j);
                        adjacency[j].push(i);
                        edges.push([i, j]);
                    }
                }
            }

            restLengths = edges.map(([a,b]) => nodePositions[a].distanceTo(nodePositions[b]));

            // Visual nodes
            const nodeGeo = new THREE.SphereGeometry(0.25, 24, 24);
            const nodeMat = new THREE.MeshPhongMaterial({color: 0xffffff, emissive: 0x44ffff, shininess: 80});
            nodePositions.forEach((pos, i) => {
                const mesh = new THREE.Mesh(nodeGeo, nodeMat.clone());
                mesh.position.copy(pos);
                mesh.userData.index = i;
                latticeGroup.add(mesh);
                nodeMeshes.push(mesh);
            });

            // Visual edges
            const lineGeo = new THREE.BufferGeometry();
            lineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(edges.length * 6), 3));
            lineSegments = new THREE.LineSegments(lineGeo, 
                new THREE.LineBasicMaterial({color: 0x00ffff, transparent: true, opacity: 0.85}));
            latticeGroup.add(lineSegments);

            updateLines();
            scene.add(latticeGroup);

            camera.position.set(0, 0, n * 4.8);
            camera.lookAt(0, 0, 0);
            latticeGroup.rotation.set(rotX, rotY, 0);
        }

        function updateLines() {
            const arr = lineSegments.geometry.attributes.position.array;
            let idx = 0;
            edges.forEach(([a,b]) => {
                const p1 = nodePositions[a], p2 = nodePositions[b];
                arr[idx++] = p1.x; arr[idx++] = p1.y; arr[idx++] = p1.z;
                arr[idx++] = p2.x; arr[idx++] = p2.y; arr[idx++] = p2.z;
            });
            lineSegments.geometry.attributes.position.needsUpdate = true;
        }

        // ====================== PURE PHYSICS ENGINE ======================
        // This is the only place where nodes and edges are updated.
        // Every edge applies its spring force every single frame.
        function updatePhysics(dt = 0.016) {
            const forces = nodePositions.map(() => new THREE.Vector3());

            // 1. All edges apply spring forces (stretch only)
            edges.forEach(([a, b], i) => {
                const rest = restLengths[i];
                const delta = new THREE.Vector3().subVectors(nodePositions[b], nodePositions[a]);
                const len = delta.length() || 1;
                const dir = delta.divideScalar(len);

                if (len > rest * 1.02) {                     // only pull when stretched
                    const forceMag = PHYSICS.springK * (len - rest);
                    const f = dir.multiplyScalar(forceMag);
                    forces[a].add(f);
                    forces[b].sub(f);
                }
            });

            // 2. Apply forces to nodes + momentum + damping
            for (let i = 0; i < nodePositions.length; i++) {
                const v = velocities[i];
                v.addScaledVector(forces[i], dt);
                v.multiplyScalar(PHYSICS.damping);
                if (v.length() > PHYSICS.maxVelocity) v.setLength(PHYSICS.maxVelocity);

                nodePositions[i].addScaledVector(v, dt);
                nodeMeshes[i].position.copy(nodePositions[i]);
            }

            updateLines();
        }

        // ====================== CHAIN COLLAPSE (impulse only) ======================
        function startChainCollapse(startIndex) {
            if (animating) return;
            animating = true;
            returnStartTime = 0;

            let current = startIndex;
            const visited = new Set([current]);
            const chain = [];

            for (let i = 0; i < 8; i++) {
                const neighbors = adjacency[current].filter(n => !visited.has(n));
                if (!neighbors.length) break;
                const next = neighbors[Math.floor(Math.random() * neighbors.length)];
                chain.push({from: current, to: next});
                visited.add(next);
                current = next;
            }

            if (chain.length === 0) { animating = false; return; }

            document.getElementById('info').style.opacity = 1;
            document.getElementById('info').textContent = `Chain: ${chain.length} edge collapses`;

            // Sequential impulses (physics still runs every frame)
            chain.forEach((step, index) => {
                setTimeout(() => {
                    if (!animating) return;
                    const dir = new THREE.Vector3().subVectors(nodePositions[step.to], nodePositions[step.from]).normalize();
                    
                    nodePositions[step.from].lerp(nodePositions[step.to], 0.94);
                    velocities[step.from].addScaledVector(dir, PHYSICS.collapseImpulse);
                    velocities[step.to].addScaledVector(dir, -PHYSICS.collapseImpulse * 0.3);

                    nodeMeshes[step.from].position.copy(nodePositions[step.from]);

                    // temporary highlight
                    nodeMeshes.forEach(m => m.material.emissive.setHex(0x44ffff));
                    nodeMeshes[step.from].material.emissive.setHex(0xff0088);
                }, index * 70);
            });

            // Start gentle return after the chain finishes
            setTimeout(() => {
                if (animating) returnStartTime = Date.now();
            }, chain.length * 70 + 800);
        }

        // ====================== RETURN TO ORIGINAL (pure spring force) ======================
        function applyReturnForce() {
            if (!returnStartTime) return;
            const elapsed = Date.now() - returnStartTime;
            const t = Math.min(1, elapsed / PHYSICS.returnDuration);
            const ease = 1 - Math.pow(1 - t, 3);

            for (let i = 0; i < nodePositions.length; i++) {
                const restoreVec = new THREE.Vector3().subVectors(originalPositions[i], nodePositions[i]);
                velocities[i].addScaledVector(restoreVec, PHYSICS.returnStrength * ease);
            }

            if (t >= 1) {
                animating = false;
                returnStartTime = 0;
                document.getElementById('info').style.opacity = 0;
                nodeMeshes.forEach(m => {
                    m.material.emissive.setHex(0x44ffff);
                    m.material.emissiveIntensity = 0.6;
                });
            }
        }

        // ====================== MOUSE CONTROLS ======================
        function setupMouse() {
            const canvas = renderer.domElement;

            canvas.addEventListener('mousedown', e => { if (e.button === 0) isDragging = true; });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', e => {
                if (!isDragging) return;
                rotY += e.movementX * 0.0045;
                rotX += e.movementY * 0.0045;
                rotX = Math.max(-1.5, Math.min(1.5, rotX));
                latticeGroup.rotation.set(rotX, rotY, 0);
            });

            canvas.addEventListener('click', e => {
                if (animating) return;

                const rect = canvas.getBoundingClientRect();
                const mouse = new THREE.Vector2(
                    ((e.clientX - rect.left) / rect.width) * 2 - 1,
                    -((e.clientY - rect.top) / rect.height) * 2 + 1
                );

                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(mouse, camera);
                const hits = raycaster.intersectObjects(nodeMeshes);
                if (hits.length > 0) startChainCollapse(hits[0].object.userData.index);
            });

            window.addEventListener('wheel', e => {
                if (animating) return;
                camera.position.z += e.deltaY * 0.12;
                camera.position.z = Math.max(15, Math.min(160, camera.position.z));
            });
        }

        // ====================== MAIN LOOP ======================
        function animate() {
            requestAnimationFrame(animate);

            if (!isDragging && !animating) latticeGroup.rotation.y += 0.0005;

            if (animating) {
                updatePhysics(0.016);        // every edge updates every frame
                applyReturnForce();          // gentle return when chain is done
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
