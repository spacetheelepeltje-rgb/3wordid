<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Connected 3D Lattice • Inner Cube Rotates Around Its Center</title>
<style>
  body { 
    margin: 0; padding: 0; background: #000; overflow: hidden; 
    font-family: Arial, sans-serif; 
    display: flex; align-items: center; justify-content: center; height: 100vh;
  }
  canvas { display: block; }
  .controls {
    position: absolute; top: 15px; left: 15px; background: rgba(0,30,20,0.9); color: #0ff;
    padding: 15px; border-radius: 10px; border: 1px solid #0ff; z-index: 100;
  }
  button { margin: 5px 3px; padding: 8px 14px; background: #002211; color: #0ff; border: 1px solid #0ff; border-radius: 4px; cursor: pointer; }
  button:hover { background: #004422; }
</style>
</head>
<body>

<div class="controls">
  <h2>10×10×10 Lattice</h2>
  <p>• Drag mouse = Rotate inner 3×3×3 cube (around its own center)<br>
     • Right-click + drag = Orbit whole scene</p>
  <button id="autoBtn">▶ Auto Rotate Inner</button>
  <button id="stopBtn">⏹ Stop</button>
  <button id="resetBtn">Reset All</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
// ============== SETUP ==============
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 12, 42);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x404040, 1.4));
const dirLight = new THREE.DirectionalLight(0x88ffdd, 1.6);
dirLight.position.set(20, 30, 25);
scene.add(dirLight);

// Parameters
const SIZE = 10;
const SPACING = 2.1;
const CENTER_IDX = Math.floor(SIZE / 2); // 5
const INNER_START = 3, INNER_END = 5;

// Materials
const outerLineMat = new THREE.LineBasicMaterial({ color: 0x00aa77 });
const innerLineMat = new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 3 });
const nodeMat = new THREE.MeshPhongMaterial({ color: 0x00cc88, emissive: 0x001100 });
const innerNodeMat = new THREE.MeshPhongMaterial({ color: 0x00ffff, emissive: 0x004444 });

// Points
const points = [];
const innerPoints = [];

// Create all nodes
for (let x = 0; x < SIZE; x++) {
  for (let y = 0; y < SIZE; y++) {
    for (let z = 0; z < SIZE; z++) {
      const isInner = (x >= INNER_START && x <= INNER_END && 
                       y >= INNER_START && y <= INNER_END && 
                       z >= INNER_START && z <= INNER_END);

      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(isInner ? 0.3 : 0.17, 20, 20),
        isInner ? innerNodeMat : nodeMat
      );

      const pos = new THREE.Vector3(
        (x - CENTER_IDX) * SPACING,
        (y - CENTER_IDX) * SPACING,
        (z - CENTER_IDX) * SPACING
      );

      mesh.position.copy(pos);
      mesh.userData = { basePos: pos.clone(), isInner, gridPos: {x, y, z} };
      scene.add(mesh);
      points.push(mesh);
      if (isInner) innerPoints.push(mesh);
    }
  }
}

// Lines container
let lines = [];

// Build lines
function buildLines() {
  lines.forEach(l => scene.remove(l));
  lines = [];

  const directions = [
    {fixed1: 'y', fixed2: 'z'}, // X-lines
    {fixed1: 'x', fixed2: 'z'}, // Y-lines
    {fixed1: 'x', fixed2: 'y'}  // Z-lines
  ];

  directions.forEach(dir => {
    for (let i = 0; i < SIZE; i++) {
      for (let j = 0; j < SIZE; j++) {
        const pts = [];
        for (let k = 0; k < SIZE; k++) {
          const coord = {};
          coord[dir.fixed1] = (i - CENTER_IDX) * SPACING;
          coord[dir.fixed2] = (j - CENTER_IDX) * SPACING;
          const missing = ['x','y','z'].find(c => !(c in coord));
          coord[missing] = (k - CENTER_IDX) * SPACING;

          const p = points.find(pt => 
            Math.abs(pt.position.x - (coord.x||0)) < 0.1 &&
            Math.abs(pt.position.y - (coord.y||0)) < 0.1 &&
            Math.abs(pt.position.z - (coord.z||0)) < 0.1
          );
          if (p) pts.push(p.position);
        }
        if (pts.length > 1) {
          const geo = new THREE.BufferGeometry().setFromPoints(pts);
          const mat = pts[0].userData?.isInner || false ? innerLineMat : outerLineMat; // simplified
          const line = new THREE.Line(geo, mat);
          scene.add(line);
          lines.push(line);
        }
      }
    }
  });
}

buildLines();

// Inner rotation group (for rotating around its own center)
const innerGroup = new THREE.Group();
innerPoints.forEach(p => innerGroup.add(p));
scene.add(innerGroup);

let innerRotationY = 0;
let innerRotationX = 0;

// Mouse controls
let isDraggingInner = false;
let prevX = 0, prevY = 0;
let isOrbiting = false;

window.addEventListener('mousedown', e => {
  if (e.button === 0) { // Left click - rotate inner cube
    isDraggingInner = true;
  } else if (e.button === 2) { // Right click - orbit whole scene
    isOrbiting = true;
  }
  prevX = e.clientX;
  prevY = e.clientY;
});

window.addEventListener('mouseup', () => {
  isDraggingInner = false;
  isOrbiting = false;
});
window.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('mousemove', e => {
  const dx = e.clientX - prevX;
  const dy = e.clientY - prevY;

  if (isDraggingInner) {
    innerRotationY += dx * 0.005;
    innerRotationX += dy * 0.005;
  } else if (isOrbiting) {
    // Simple orbit
    const rotSpeed = 0.003;
    camera.position.x = Math.sin(e.clientX * rotSpeed) * 45;
    camera.position.z = Math.cos(e.clientX * rotSpeed) * 45;
    camera.position.y += dy * 0.1;
    camera.lookAt(0, 0, 0);
  }
  prevX = e.clientX;
  prevY = e.clientY;
});

// Auto rotate
let autoRotate = false;
document.getElementById('autoBtn').onclick = () => autoRotate = true;
document.getElementById('stopBtn').onclick = () => autoRotate = false;
document.getElementById('resetBtn').onclick = () => {
  innerRotationY = 0;
  innerRotationX = 0;
  camera.position.set(0, 12, 42);
  camera.lookAt(0, 0, 0);
};

// Update inner cube rotation around its own center
function updateInner() {
  if (autoRotate) innerRotationY += 0.007;

  const centerOffset = new THREE.Vector3(
    (CENTER_IDX - CENTER_IDX) * SPACING, 0, 0
  ); // already centered

  innerPoints.forEach(p => {
    const localPos = p.userData.basePos.clone();
    // Rotate around Y then X
    localPos.applyAxisAngle(new THREE.Vector3(0,1,0), innerRotationY);
    localPos.applyAxisAngle(new THREE.Vector3(1,0,0), innerRotationX);
    p.position.copy(localPos);
  });
}

// Animation
function animate() {
  requestAnimationFrame(animate);
  updateInner();
  buildLines();           // Rebuild lines to keep connections
  renderer.render(scene, camera);
}

animate();

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
