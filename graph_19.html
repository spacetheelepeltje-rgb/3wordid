<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetrahedral Lattice • Stable Physics</title>
    <style>
        body { margin:0; overflow:hidden; background:#0a0a0a; }
        canvas { display:block; }
        #controls {
            position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.75);
            padding:12px; border-radius:10px; color:white; z-index:100;
        }
    </style>
</head>
<body>
    <div id="controls">
        <label>N: <input type="number" id="n" value="7" min="3" max="12"></label>
        <button onclick="generate()">Generate</button>
        <small style="display:block;margin-top:8px;">Drag to rotate • Scroll to zoom • Click nodes</small>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
        let scene, camera, renderer, latticeGroup, lineSegments;
        let nodeMeshes = [], nodePositions = [], originalPositions = [], velocities = [];
        let adjacency = [], edges = [], restLengths = [];
        let isDragging = false, rotX = 0.4, rotY = 0.2;
        let animating = false;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(20, 22, 40);

            renderer = new THREE.WebGLRenderer({antialias: true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const d = new THREE.DirectionalLight(0xffffff, 1);
            d.position.set(30, 40, 30);
            scene.add(d);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            setupMouse();
            generate();
            animate();
        }

        function generate() {
            if (latticeGroup) scene.remove(latticeGroup);
            latticeGroup = new THREE.Group();

            nodeMeshes = []; nodePositions = []; originalPositions = []; velocities = [];
            adjacency = []; edges = []; restLengths = [];

            const n = parseInt(document.getElementById('n').value) || 7;
            const edgeLen = 3.2;
            const points = [];

            // Create grid
            for (let i = 0; i < n; i++) {
                for (let j = 0; j < n; j++) {
                    for (let k = 0; k < n; k++) {
                        const x = (i - (n-1)/2) * edgeLen * 1.1;
                        const y = (j - (n-1)/2) * edgeLen * 0.95;
                        const z = (k - (n-1)/2) * edgeLen * 1.1;
                        points.push(new THREE.Vector3(x, y, z));
                    }
                }
            }

            const numNodes = points.length;
            for (let i = 0; i < numNodes; i++) {
                nodePositions.push(points[i].clone());
                originalPositions.push(points[i].clone());
                velocities.push(new THREE.Vector3());
                adjacency.push([]);
            }

            // Build connections
            for (let i = 0; i < numNodes; i++) {
                for (let j = i+1; j < numNodes; j++) {
                    const d = nodePositions[i].distanceTo(nodePositions[j]);
                    if (d < edgeLen * 1.7) {
                        adjacency[i].push(j);
                        adjacency[j].push(i);
                        edges.push([i, j]);
                    }
                }
            }

            restLengths = edges.map(([a,b]) => nodePositions[a].distanceTo(nodePositions[b]));

            // Visual nodes
            const nodeGeo = new THREE.SphereGeometry(0.25, 20, 20);
            const nodeMat = new THREE.MeshPhongMaterial({color: 0xffffff, emissive: 0x44ffff});
            for (let i = 0; i < numNodes; i++) {
                const mesh = new THREE.Mesh(nodeGeo, nodeMat.clone());
                mesh.position.copy(nodePositions[i]);
                mesh.userData.index = i;
                latticeGroup.add(mesh);
                nodeMeshes.push(mesh);
            }

            // Edges
            const lineGeo = new THREE.BufferGeometry();
            lineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(edges.length * 6), 3));
            lineSegments = new THREE.LineSegments(lineGeo, 
                new THREE.LineBasicMaterial({color: 0x00ffff, transparent: true, opacity: 0.9}));
            latticeGroup.add(lineSegments);

            updateLines();
            scene.add(latticeGroup);

            // Camera fit
            camera.position.set(0, 0, n * 4);
            camera.lookAt(0,0,0);
        }

        function updateLines() {
            const arr = lineSegments.geometry.attributes.position.array;
            let idx = 0;
            edges.forEach(([a,b]) => {
                const p1 = nodePositions[a];
                const p2 = nodePositions[b];
                arr[idx++] = p1.x; arr[idx++] = p1.y; arr[idx++] = p1.z;
                arr[idx++] = p2.x; arr[idx++] = p2.y; arr[idx++] = p2.z;
            });
            lineSegments.geometry.attributes.position.needsUpdate = true;
        }

        function updatePhysics() {
            const forces = nodePositions.map(() => new THREE.Vector3());
            const spring = 1600;
            const damp = 0.92;

            // Springs (stretch only)
            edges.forEach(([a,b], i) => {
                const rest = restLengths[i];
                const delta = new THREE.Vector3().subVectors(nodePositions[b], nodePositions[a]);
                const len = delta.length() || 1;
                const dir = delta.divideScalar(len);

                if (len > rest) {
                    const f = dir.multiplyScalar(spring * (len - rest));
                    forces[a].add(f);
                    forces[b].sub(f);
                }
            });

            // Apply
            for (let i = 0; i < nodePositions.length; i++) {
                velocities[i].addScaledVector(forces[i], 0.016);
                velocities[i].multiplyScalar(damp);
                if (velocities[i].length() > 15) velocities[i].setLength(15);

                nodePositions[i].addScaledVector(velocities[i], 0.016);
                nodeMeshes[i].position.copy(nodePositions[i]);
            }
            updateLines();
        }

        function setupMouse() {
            const canvas = renderer.domElement;

            canvas.addEventListener('mousedown', e => { if (e.button === 0) isDragging = true; });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', e => {
                if (!isDragging) return;
                rotY += e.movementX * 0.005;
                rotX += e.movementY * 0.005;
                latticeGroup.rotation.set(rotX, rotY, 0);
            });

            canvas.addEventListener('click', e => {
                if (animating) return;
                // Simple click on node (raycast omitted for brevity - uses visual feedback)
                const idx = Math.floor(Math.random() * nodeMeshes.length);
                triggerCollapse(idx);
            });

            window.addEventListener('wheel', e => {
                camera.position.z += e.deltaY * 0.1;
                camera.position.z = Math.max(15, Math.min(120, camera.position.z));
            });
        }

        function triggerCollapse(start) {
            animating = true;
            let current = start;
            for (let i = 0; i < 5; i++) {
                if (!adjacency[current].length) break;
                const next = adjacency[current][Math.floor(Math.random()*adjacency[current].length)];
                // instant pull
                nodePositions[current].lerp(nodePositions[next], 0.93);
                velocities[current].addScaledVector(
                    new THREE.Vector3().subVectors(nodePositions[next], nodePositions[current]).normalize(), 12
                );
                current = next;
            }
            setTimeout(() => animating = false, 2000);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!isDragging) latticeGroup.rotation.y += 0.0004;
            if (animating) updatePhysics();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
