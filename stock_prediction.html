<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Growth Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: right; }
        th { background-color: #f2f2f2; }
        .input-container { margin-bottom: 20px; }
        label { margin-right: 10px; }
    </style>
</head>
<body>
    <h1>Stock Growth Calculator</h1>
    <div class="input-container">
        <label>Current Stock Price ($): <input type="number" id="currentPrice" step="0.01" min="0"></label>
        <label>Future Stock Price ($): <input type="number" id="futurePrice" step="0.01" min="0"></label>
        <label>Current Stock Holding: <input type="number" id="currentHolding" step="1" min="0"></label>
        <label>Monthly Allowance ($): <input type="number" id="monthlyAllowance" step="0.01" min="0"></label>
        <button onclick="calculateTable()">Calculate</button>
    </div>
    <div id="result"></div>

    <script>
        function calculateTable() {
            // Get input values
            const currentPrice = parseFloat(document.getElementById('currentPrice').value);
            const futurePrice = parseFloat(document.getElementById('futurePrice').value);
            const currentHolding = parseFloat(document.getElementById('currentHolding').value);
            const monthlyAllowance = parseFloat(document.getElementById('monthlyAllowance').value);

            // Validate inputs
            if (isNaN(currentPrice) || isNaN(futurePrice) || isNaN(currentHolding) || isNaN(monthlyAllowance) ||
                currentPrice < 0 || futurePrice < 0 || currentHolding < 0 || monthlyAllowance < 0) {
                alert('Please enter valid positive numbers for all fields.');
                return;
            }

            // Define date range: April 2025 to January 2029
            const startDate = new Date('2025-04-01');
            const endDate = new Date('2029-01-01');
            const months = [];
            let currentDate = new Date(startDate);
            while (currentDate <= endDate) {
                months.push(new Date(currentDate));
                currentDate.setMonth(currentDate.getMonth() + 1);
            }
            const totalMonths = months.length;

            // Calculate monthly interest rate for stock price growth
            const monthlyRate = (futurePrice / currentPrice) ** (1 / (totalMonths - 1)) - 1;

            // Build table data
            let stockPrice = currentPrice;
            let stockHolding = currentHolding;
            const tableData = {
                months: [],
                prices: [],
                stocksSold: [],
                allowances: [],
                totalValues: []
            };

            for (let i = 0; i < totalMonths; i++) {
                tableData.months.push(months[i].toLocaleString('default', { month: 'long', year: 'numeric' }));
                tableData.prices.push(stockPrice);

                // Calculate stocks to sell for monthly allowance
                const stocksToSell = monthlyAllowance / stockPrice;
                const stocksSold = Math.min(stocksToSell, stockHolding); // Can't sell more than you have
                tableData.stocksSold.push(stocksSold);

                // Monthly allowance achieved
                const achievedAllowance = stocksSold * stockPrice;
                tableData.allowances.push(achievedAllowance);

                // Update holdings and total value
                stockHolding -= stocksSold;
                tableData.totalValues.push(stockHolding * stockPrice);

                // Increase stock price for next month
                stockPrice *= (1 + monthlyRate);
            }

            // Generate table HTML
            let tableHTML = '<table><tr><th>Month</th><th>Stock Price ($)</th><th>Stocks Sold</th><th>Monthly Allowance ($)</th><th>Total Value ($)</th></tr>';
            for (let i = 0; i < totalMonths; i++) {
                tableHTML += `<tr>
                    <td>${tableData.months[i]}</td>
                    <td>${tableData.prices[i].toFixed(2)}</td>
                    <td>${tableData.stocksSold[i].toFixed(2)}</td>
                    <td>${tableData.allowances[i].toFixed(2)}</td>
                    <td>${tableData.totalValues[i].toFixed(2)}</td>
                </tr>`;
            }
            tableHTML += '</table>';

            // Display table
            document.getElementById('result').innerHTML = tableHTML;
        }
    </script>
</body>
</html>
