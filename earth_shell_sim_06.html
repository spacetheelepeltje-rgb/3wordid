<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Earth Sunshade - Sunny-Side Satellite Constellation</title>
<style>
  body { margin:0; overflow:hidden; background:#000; font-family:Arial, sans-serif; }
  
  #controls {
    position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
    color: white; background: rgba(0,0,0,0.85); padding: 18px 25px;
    border-radius: 12px; display: flex; align-items: center; gap: 20px;
    z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
  }
  #controls label { font-size: 16px; font-weight: bold; }
  #controls input { width: 130px; padding: 10px; font-size: 16px; border-radius: 6px; }
  #controls button {
    padding: 12px 22px; font-size: 16px; font-weight: bold;
    background: #00aaff; color: white; border: none; border-radius: 6px; cursor: pointer;
  }
  #controls button:hover { background: #00ccff; }

  #info {
    position: absolute; top: 80px; left: 20px; color: white; 
    background: rgba(0,0,0,0.65); padding: 12px; border-radius: 8px; 
    font-size: 14px; pointer-events: none;
  }
</style>
</head>
<body>

<div id="controls">
  <label>Number of Satellites:</label>
  <input type="number" id="satInput" value="60">
  
  <button onclick="updateSatellites()">Update Constellation</button>
  <button onclick="toggleRotation()">Pause Rotation</button>
</div>

<div id="info">
  <strong>Earth Sunshade — Sunny-Side Persistent Constellation</strong><br>
  <span id="stats"></span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>

<script>
// ============== CONFIG ==============
const EARTH_RADIUS_KM = 6371;
const SAT_ALTITUDE_KM = 700;

const SCALE = 0.001;
const EARTH_RADIUS = EARTH_RADIUS_KM * SCALE;
const SAT_RADIUS = (EARTH_RADIUS_KM + SAT_ALTITUDE_KM) * SCALE;

let numSatellites = 60;
let rotating = true;

// ============== THREE.JS SETUP ==============
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 12, 26);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// === Strong Sun Light (Sunny Side) ===
const sunLight = new THREE.DirectionalLight(0xffffff, 1.75);
sunLight.position.set(180, 70, 120);   // Strong sun from this direction
scene.add(sunLight);

scene.add(new THREE.AmbientLight(0x203050, 0.35)); // Darker night side

// ============== EARTH ==============
const earth = new THREE.Mesh(
  new THREE.SphereGeometry(EARTH_RADIUS, 96, 96),
  new THREE.MeshPhongMaterial({ 
    color: 0x1e4a8f,
    shininess: 18,
    specular: 0x222222
  })
);
scene.add(earth);

// Land tint
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(EARTH_RADIUS * 1.003, 96, 96),
  new THREE.MeshPhongMaterial({ 
    color: 0x2a5c2a, 
    transparent: true, 
    opacity: 0.25
  })
));

// Atmosphere
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(EARTH_RADIUS * 1.028, 64, 64),
  new THREE.MeshPhongMaterial({ 
    color: 0x88ccff, 
    transparent: true, 
    opacity: 0.16, 
    side: THREE.BackSide 
  })
));

// ============== SATELLITES ==============
let satelliteGroup = new THREE.Group();
scene.add(satelliteGroup);

function createSatellites() {
  satelliteGroup.clear();

  const points = [];
  const golden = Math.PI * (3 - Math.sqrt(5));

  // Concentrated on the sunny side (facing the sun)
  for (let i = 0; i < numSatellites; i++) {
    const t = i / numSatellites;
    
    // Bias distribution heavily toward the sun-facing hemisphere
    const latitudeSpread = Math.sin(t * Math.PI) * 0.7;           // polar spread
    const longitudeBias = Math.cos(t * Math.PI * 2) * 0.6 + 0.4; // bias toward sun

    const theta = t * Math.PI * 2.4;   // orbital angle
    const phi = Math.PI * 0.5 + latitudeSpread * 1.1;

    const x = Math.sin(phi) * Math.cos(theta) * SAT_RADIUS;
    const y = Math.cos(phi) * SAT_RADIUS * 0.85;               // vertical spread
    const z = Math.sin(phi) * Math.sin(theta) * SAT_RADIUS * 0.55; // compressed away from sun

    // Shift entire constellation toward the sun direction
    points.push(new THREE.Vector3(x + SAT_RADIUS * 0.25, y, z));
  }

  // Create satellites
  const satGeo = new THREE.SphereGeometry(0.045, 14, 14);
  const satMat = new THREE.MeshPhongMaterial({ 
    color: 0xffee55, 
    emissive: 0xffdd00, 
    emissiveIntensity: 1.2,
    shininess: 25
  });

  const sats = new THREE.InstancedMesh(satGeo, satMat, numSatellites);
  const dummy = new THREE.Object3D();

  points.forEach((p, i) => {
    dummy.position.copy(p);
    dummy.lookAt(0, 0, 0);
    dummy.updateMatrix();
    sats.setMatrixAt(i, dummy.matrix);
  });
  satelliteGroup.add(sats);

  // Connect with edges for clarity
  const connections = [];
  const maxDist = SAT_RADIUS * 0.38;

  for (let i = 0; i < numSatellites; i++) {
    for (let j = i + 1; j < numSatellites; j++) {
      if (points[i].distanceTo(points[j]) < maxDist) {
        connections.push(points[i]);
        connections.push(points[j]);
      }
    }
  }

  const lineGeo = new THREE.BufferGeometry().setFromPoints(connections);
  const lineMat = new THREE.LineBasicMaterial({ 
    color: 0x99ffdd, 
    transparent: true, 
    opacity: 0.55 
  });
  satelliteGroup.add(new THREE.LineSegments(lineGeo, lineMat));

  document.getElementById('stats').innerHTML = `
    Altitude: 700 km<br>
    Satellites: ${numSatellites}<br>
    Connections: ${(connections.length/2).toLocaleString()}<br>
    Position: Concentrated on Sunny Side
  `;
}

// ============== ANIMATION ==============
function animate() {
  requestAnimationFrame(animate);
  controls.update();

  if (rotating) {
    const speed = 0.00038;
    earth.rotation.y += speed;
    satelliteGroup.rotation.y += speed * 0.95; // nearly stationary relative to sun
  }

  renderer.render(scene, camera);
}
animate();

// ============== CONTROLS ==============
window.updateSatellites = function() {
  numSatellites = Math.max(12, Math.min(360, parseFloat(document.getElementById('satInput').value) || 60));
  createSatellites();
};

window.toggleRotation = function() {
  rotating = !rotating;
  const btn = document.querySelectorAll('#controls button')[1];
  btn.textContent = rotating ? "Pause Rotation" : "Resume Rotation";
};

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Initial
createSatellites();
</script>
</body>
</html>
