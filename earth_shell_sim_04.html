<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Earth Sunshade - Dawn-Dusk SSO Satellite Constellation</title>
<style>
  body { margin:0; overflow:hidden; background:#000; font-family:Arial, sans-serif; }
  
  #controls {
    position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
    color: white; background: rgba(0,0,0,0.85); padding: 18px 25px;
    border-radius: 12px; display: flex; align-items: center; gap: 20px;
    z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
  }
  #controls label { font-size: 16px; font-weight: bold; }
  #controls input { width: 130px; padding: 10px; font-size: 16px; border-radius: 6px; }
  #controls button {
    padding: 12px 22px; font-size: 16px; font-weight: bold;
    background: #00aaff; color: white; border: none; border-radius: 6px; cursor: pointer;
  }
  #controls button:hover { background: #00ccff; }

  #info {
    position: absolute; top: 90px; left: 20px; color: white; 
    background: rgba(0,0,0,0.65); padding: 12px; border-radius: 8px; 
    font-size: 14px; pointer-events: none;
  }
</style>
</head>
<body>

<div id="controls">
  <label>Triangle Area (sq miles):</label>
  <input type="number" id="areaInput" value="800">
  <button onclick="updateShell()">Update Network</button>
  <button onclick="toggleRotation()">Pause Rotation</button>
</div>

<div id="info">
  <strong>Earth Sunshade Model — Dawn-Dusk SSO Constellation</strong><br>
  <span id="stats"></span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>

<script>
// ============== CONFIG ==============
const EARTH_RADIUS_KM = 6371;
const ALTITUDE_KM = 550;
const SHELL_RADIUS_KM = EARTH_RADIUS_KM + ALTITUDE_KM;

const SCALE = 0.001;
const EARTH_RADIUS = EARTH_RADIUS_KM * SCALE;
const SHELL_RADIUS = SHELL_RADIUS_KM * SCALE;

let triangleAreaSqMiles = 800;
let rotating = true;

// ============== THREE.JS SETUP ==============
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 8, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// === Lighting - Sunny side vs Shade side ===
const sunLight = new THREE.DirectionalLight(0xffffff, 1.4);
sunLight.position.set(80, 30, 40);   // Sun direction (right side)
scene.add(sunLight);

scene.add(new THREE.AmbientLight(0x404060, 0.6)); // soft fill light for night side

// ============== EARTH (with day/night) ==============
const earthGeo = new THREE.SphereGeometry(EARTH_RADIUS, 64, 64);
const earthMat = new THREE.MeshPhongMaterial({ 
  color: 0x1e4a8f,
  shininess: 8,
  specular: 0x222222
});
const earth = new THREE.Mesh(earthGeo, earthMat);
scene.add(earth);

// Night side glow
const nightGlow = new THREE.Mesh(
  new THREE.SphereGeometry(EARTH_RADIUS * 1.005, 64, 64),
  new THREE.MeshBasicMaterial({
    color: 0x112244,
    transparent: true,
    opacity: 0.6,
    blending: THREE.AdditiveBlending
  })
);
scene.add(nightGlow);

// Atmosphere
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(EARTH_RADIUS * 1.018, 64, 64),
  new THREE.MeshPhongMaterial({ 
    color: 0x88ccff, 
    transparent: true, 
    opacity: 0.13, 
    side: THREE.BackSide 
  })
));

// ============== SHELL (Triangular Network) ==============
let shellGroup = new THREE.Group();
scene.add(shellGroup);

// ============== SATELLITES (Dawn-Dusk SSO) ==============
let satelliteGroup = new THREE.Group();
scene.add(satelliteGroup);

function createSatellites(count = 24) {
  satelliteGroup.clear();
  const satGeo = new THREE.SphereGeometry(0.035, 12, 12);
  const satMat = new THREE.MeshPhongMaterial({ color: 0xffff00, emissive: 0xffaa00, emissiveIntensity: 0.8 });

  const dummy = new THREE.Object3D();
  const sats = new THREE.InstancedMesh(satGeo, satMat, count);

  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2;
    // Dawn-dusk SSO positioning: satellites stay roughly on the terminator plane
    const x = Math.cos(angle) * SHELL_RADIUS * 1.05;
    const z = Math.sin(angle) * SHELL_RADIUS * 0.3;   // flattened along sun direction
    const y = Math.sin(angle) * SHELL_RADIUS * 0.6;

    dummy.position.set(x, y, z);
    dummy.lookAt(0, 0, 0);
    dummy.updateMatrix();
    sats.setMatrixAt(i, dummy.matrix);
  }
  satelliteGroup.add(sats);
}

// ============== CREATE SHELL ==============
function createShell() {
  shellGroup.clear();

  const areaSqKm = triangleAreaSqMiles * 2.58999;
  const shellSurfaceArea = 4 * Math.PI * SHELL_RADIUS_KM ** 2;
  let numPoints = Math.floor(shellSurfaceArea / areaSqKm);
  numPoints = Math.max(120, Math.min(numPoints, 8500));

  const points = [];
  const golden = Math.PI * (3 - Math.sqrt(5));

  for (let i = 0; i < numPoints; i++) {
    const y = 1 - (i / (numPoints - 1)) * 2;
    const radius = Math.sqrt(1 - y * y);
    const theta = golden * i;

    const x = Math.cos(theta) * radius;
    const z = Math.sin(theta) * radius;
    points.push(new THREE.Vector3(x, y, z).multiplyScalar(SHELL_RADIUS));
  }

  // Tiny nodes
  const nodes = new THREE.InstancedMesh(
    new THREE.SphereGeometry(0.016, 10, 10),
    new THREE.MeshPhongMaterial({ color: 0x00ffdd, emissive: 0x00ffcc }),
    numPoints
  );
  const dummy = new THREE.Object3D();
  points.forEach((p, i) => {
    dummy.position.copy(p);
    dummy.updateMatrix();
    nodes.setMatrixAt(i, dummy.matrix);
  });
  shellGroup.add(nodes);

  // Clean nearest-neighbor connections
  const connections = [];
  const k = 5;

  for (let i = 0; i < numPoints; i++) {
    const neighbors = [];
    for (let j = i+1; j < numPoints; j++) {
      const d = points[i].distanceTo(points[j]);
      if (d < SHELL_RADIUS * 0.22) neighbors.push({j, d});
    }
    neighbors.sort((a,b)=>a.d-b.d).slice(0, k).forEach(n => {
      connections.push(points[i]);
      connections.push(points[n.j]);
    });
  }

  const lines = new THREE.LineSegments(
    new THREE.BufferGeometry().setFromPoints(connections),
    new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.55 })
  );
  shellGroup.add(lines);

  document.getElementById('stats').innerHTML = `
    Altitude: 550 km<br>
    Nodes: ${numPoints.toLocaleString()}<br>
    Edges: ${(connections.length/2).toLocaleString()}<br>
    SSO Satellites: 24 | Area: ${triangleAreaSqMiles} sq mi
  `;
}

// ============== ANIMATION ==============
function animate() {
  requestAnimationFrame(animate);
  controls.update();

  if (rotating) {
    const speed = 0.0004;
    earth.rotation.y += speed;
    shellGroup.rotation.y += speed;
    satelliteGroup.rotation.y += speed * 0.6; // slower relative motion for SSO feel
  }

  renderer.render(scene, camera);
}
animate();

// ============== CONTROLS ==============
window.updateShell = function() {
  triangleAreaSqMiles = parseFloat(document.getElementById('areaInput').value) || 800;
  createShell();
};

window.toggleRotation = function() {
  rotating = !rotating;
  const btn = document.querySelectorAll('#controls button')[1];
  btn.textContent = rotating ? "Pause Rotation" : "Resume Rotation";
};

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Initial setup
createShell();
createSatellites(24);
</script>
</body>
</html>
