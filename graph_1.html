<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Node Repulsion Simulation</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111;
        color: #0f0;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }
    #controls {
        padding: 10px;
        background: #1a1a1a;
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        align-items: center;
        border-bottom: 1px solid #0f0;
    }
    canvas {
        background: #000;
        flex: 1;
        display: block;
    }
    label { margin-right: 5px; }
    input, button, select {
        background: #222;
        color: #0f0;
        border: 1px solid #0f0;
        padding: 5px 8px;
    }
    button {
        cursor: pointer;
        font-weight: bold;
    }
    button:hover { background: #0f0; color: #000; }
</style>
</head>
<body>

<div id="controls">
    <div>
        <label>Nodes (n):</label>
        <input type="number" id="numNodes" value="50" min="5" max="500" style="width:80px">
    </div>
    <div>
        <label>Edges per Node:</label>
        <input type="number" id="edgesPerNode" value="6" min="1" max="30" style="width:70px">
    </div>
    <div>
        <label>Boundary Size:</label>
        <input type="number" id="size" value="800" min="400" max="1200" style="width:90px">
    </div>
    <div>
        <label>Repulsion:</label>
        <input type="range" id="repulsion" min="100" max="2000" value="800" step="50">
        <span id="repVal">800</span>
    </div>
    <div>
        <label>Friction:</label>
        <input type="range" id="friction" min="0.9" max="0.99" value="0.96" step="0.01">
        <span id="fricVal">0.96</span>
    </div>
    <div>
        <label>Edge Opacity:</label>
        <input type="range" id="edgeOpacity" min="0.01" max="0.5" value="0.18" step="0.01">
        <span id="edgeVal">0.18</span>
    </div>
    <button onclick="resetSimulation()">Reset</button>
    <button onclick="togglePause()">Pause / Resume</button>
    <span id="stats" style="margin-left:auto"></span>
</div>

<canvas id="canvas"></canvas>

<script>
// =============== CONFIG & STATE ===============
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let nodes = [];
let boundarySize = 800;
let isPaused = false;

// =============== NODE CLASS ===============
class Node {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 4;
        this.vy = (Math.random() - 0.5) * 4;
        this.radius = 6;
        this.neighbors = [];        // New: store connected nodes
    }
}

// =============== BUILD CONNECTIONS ===============
function buildConnections() {
    const k = parseInt(document.getElementById('edgesPerNode').value);
    
    // Clear old neighbors
    nodes.forEach(node => node.neighbors = []);

    for (let i = 0; i < nodes.length; i++) {
        const distances = [];

        for (let j = 0; j < nodes.length; j++) {
            if (i === j) continue;
            const a = nodes[i];
            const b = nodes[j];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const distSq = dx * dx + dy * dy;
            distances.push({ index: j, distSq });
        }

        // Sort by distance and take closest K nodes
        distances.sort((a, b) => a.distSq - b.distSq);
        const topK = distances.slice(0, Math.min(k, distances.length));

        topK.forEach(item => {
            nodes[i].neighbors.push(nodes[item.index]);
        });
    }
}

// =============== INIT ===============
function initSimulation() {
    const n = parseInt(document.getElementById('numNodes').value);
    boundarySize = parseInt(document.getElementById('size').value);
    
    canvas.width = boundarySize;
    canvas.height = boundarySize;
    
    nodes = [];
    for (let i = 0; i < n; i++) {
        const x = 50 + Math.random() * (boundarySize - 100);
        const y = 50 + Math.random() * (boundarySize - 100);
        nodes.push(new Node(x, y));
    }

    buildConnections();
}

// =============== PHYSICS ===============
function updatePhysics() {
    const repulsion = parseFloat(document.getElementById('repulsion').value);
    const friction = parseFloat(document.getElementById('friction').value);

    // Repulsion between all pairs
    for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
            const a = nodes[i];
            const b = nodes[j];
            
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const distSq = dx * dx + dy * dy;
            
            if (distSq < 1) continue;
            
            const dist = Math.sqrt(distSq);
            const force = repulsion / distSq;
            
            const fx = (dx / dist) * force;
            const fy = (dy / dist) * force;
            
            a.vx -= fx;
            a.vy -= fy;
            b.vx += fx;
            b.vy += fy;
        }
    }

    // Update positions + friction + boundaries
    for (let node of nodes) {
        node.vx *= friction;
        node.vy *= friction;
        
        node.x += node.vx;
        node.y += node.vy;

        // Bounce off walls
        if (node.x - node.radius < 0) { node.x = node.radius; node.vx = -node.vx * 0.8; }
        if (node.x + node.radius > boundarySize) { node.x = boundarySize - node.radius; node.vx = -node.vx * 0.8; }
        if (node.y - node.radius < 0) { node.y = node.radius; node.vy = -node.vy * 0.8; }
        if (node.y + node.radius > boundarySize) { node.y = boundarySize - node.radius; node.vy = -node.vy * 0.8; }
    }
}

// =============== RENDER ===============
function draw() {
    // Fade trail
    ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const edgeOpacity = parseFloat(document.getElementById('edgeOpacity').value);

    // === DRAW EDGES ===
    ctx.strokeStyle = `rgba(0, 255, 100, ${edgeOpacity})`;
    ctx.lineWidth = 1.1;

    for (let node of nodes) {
        for (let neighbor of node.neighbors) {
            // Draw only one direction (avoid double drawing)
            if (node.x < neighbor.x) {   // simple way to reduce duplicates
                ctx.beginPath();
                ctx.moveTo(node.x, node.y);
                ctx.lineTo(neighbor.x, neighbor.y);
                ctx.stroke();
            }
        }
    }

    // === DRAW NODES ===
    ctx.fillStyle = '#0f0';
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#0f0';

    for (let node of nodes) {
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.shadowBlur = 0;
}

// =============== ANIMATION LOOP ===============
function loop() {
    if (!isPaused) updatePhysics();
    draw();

    document.getElementById('stats').textContent = 
        `${nodes.length} nodes | ${parseInt(document.getElementById('edgesPerNode').value)} edges/node`;

    requestAnimationFrame(loop);
}

// =============== UI ===============
document.getElementById('repulsion').addEventListener('input', function() {
    document.getElementById('repVal').textContent = this.value;
});

document.getElementById('friction').addEventListener('input', function() {
    document.getElementById('fricVal').textContent = parseFloat(this.value).toFixed(2);
});

document.getElementById('edgeOpacity').addEventListener('input', function() {
    document.getElementById('edgeVal').textContent = parseFloat(this.value).toFixed(2);
});

function resetSimulation() {
    initSimulation();
}

function togglePause() {
    isPaused = !isPaused;
}

// =============== START ===============
initSimulation();
loop();
</script>
</body>
</html>
