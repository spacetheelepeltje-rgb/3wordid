<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FCC Graph - Round Points + Clear Edges</title>
<style>
  body { margin:0; overflow:hidden; background:#000; }
  #info {
    position: absolute; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,0.8);
    padding: 12px; border-radius: 8px; font-family: Arial, sans-serif; z-index: 100;
  }
  #controls {
    position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8);
    padding: 12px; border-radius: 8px; color: white; z-index: 100;
  }
</style>
</head>
<body>
<div id="info">
  <b>FCC Tangency Graph</b><br>
  Round Points + Edges • Inner nodes have 12 connections
</div>
<div id="controls">
  <label>Layers: <span id="layerValue">3</span></label>
  <input type="range" id="layers" min="1" max="6" value="3" step="1">
  <button id="rebuild">Rebuild Graph</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>

<script>
// ============== FCC Graph - Round Points + Clear Edges ==============
let scene, camera, renderer, controls;
let pointsObject = null;
let edgeLines = [];

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05050f);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(22, 18, 28);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.1;

  scene.add(new THREE.AmbientLight(0xffffff, 0.9));
}

// Create round point texture
function createRoundPointTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 64;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');
  
  ctx.clearRect(0, 0, 64, 64);
  ctx.fillStyle = '#66eeff';
  ctx.beginPath();
  ctx.arc(32, 32, 28, 0, Math.PI * 2);
  ctx.fill();
  
  return new THREE.CanvasTexture(canvas);
}

function createFCC(layers) {
  if (pointsObject) scene.remove(pointsObject);
  edgeLines.forEach(l => scene.remove(l));
  edgeLines = [];

  const nnDistance = 2.0;
  const positions = [];

  for (let x = -layers; x <= layers; x++) {
    for (let y = -layers; y <= layers; y++) {
      for (let z = -layers; z <= layers; z++) {
        const base = new THREE.Vector3(x, y, z);
        const candidates = [
          base,
          base.clone().add(new THREE.Vector3(0.5, 0.5, 0)),
          base.clone().add(new THREE.Vector3(0.5, 0,   0.5)),
          base.clone().add(new THREE.Vector3(0,   0.5, 0.5))
        ];
        candidates.forEach(p => {
          p.multiplyScalar(nnDistance * 0.7071);
          if (p.length() < layers * 7.5) positions.push(p);
        });
      }
    }
  }

  const uniquePos = [];
  positions.forEach(p => {
    if (!uniquePos.some(q => p.distanceTo(q) < 0.05)) uniquePos.push(p);
  });

  // === ROUND POINTS ===
  const pointsGeo = new THREE.BufferGeometry().setFromPoints(uniquePos);
  const pointsMat = new THREE.PointsMaterial({
    map: createRoundPointTexture(),
    size: 0.3,
    sizeAttenuation: true,
    transparent: true,
    opacity: 1.0,
    depthTest: false
  });

  pointsObject = new THREE.Points(pointsGeo, pointsMat);
  scene.add(pointsObject);

  // === EDGES ===
  const lineMat = new THREE.LineBasicMaterial({
    color: 0x99ffcc,
    transparent: true,
    opacity: 0.85
  });

  for (let i = 0; i < uniquePos.length; i++) {
    for (let j = i + 1; j < uniquePos.length; j++) {
      const dist = uniquePos[i].distanceTo(uniquePos[j]);
      if (Math.abs(dist - nnDistance) < 0.15) {
        const lineGeo = new THREE.BufferGeometry().setFromPoints([uniquePos[i], uniquePos[j]]);
        const line = new THREE.Line(lineGeo, lineMat);
        scene.add(line);
        edgeLines.push(line);
      }
    }
  }
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

// Start
init();
createFCC(3);
animate();

// Controls
const slider = document.getElementById('layers');
const valDisplay = document.getElementById('layerValue');

document.getElementById('rebuild').addEventListener('click', () => {
  createFCC(parseInt(slider.value));
});

slider.addEventListener('input', () => valDisplay.textContent = slider.value);

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
