<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FCC Graph - Edges Only (12 Neighbors)</title>
<style>
  body { margin:0; overflow:hidden; background:#000; }
  #info {
    position: absolute; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,0.7);
    padding: 12px; border-radius: 8px; font-family: Arial, sans-serif; z-index: 100;
  }
</style>
</head>
<body>
<div id="info">
  <b>FCC Tangency Graph — Edges Only</b><br>
  Each internal node has exactly 12 edges<br>
  Drag to rotate • Scroll to zoom
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>

<script>
// ============== FCC Graph - Edges Focused ==============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05050f);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(15, 12, 20);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.8));

// Small glowing nodes
const nodeMaterial = new THREE.PointsMaterial({
  color: 0x66ccff,
  size: 0.35,
  sizeAttenuation: true
});

// Bright bonds
const bondMaterial = new THREE.LineBasicMaterial({
  color: 0x99ffcc,
  transparent: true,
  opacity: 0.85,
  linewidth: 3   // Note: linewidth >1 only works in some browsers
});

// Parameters
const radius = 1;
const nnDistance = 2 * radius;

// Generate FCC positions
const positions = [];
const layers = 4;

for (let x = -layers; x <= layers; x++) {
  for (let y = -layers; y <= layers; y++) {
    for (let z = -layers; z <= layers; z++) {
      const base = new THREE.Vector3(x, y, z);
      const candidates = [
        base,
        base.clone().addScalar(0.5).setComponent(2, base.z),
        base.clone().addScalar(0.5).setComponent(1, base.y),
        base.clone().addScalar(0.5).setComponent(0, base.x)
      ];

      candidates.forEach(p => {
        p.multiplyScalar(nnDistance * 0.7071); // √2 / 2 scaling
        if (p.length() < 22) positions.push(p.clone());
      });
    }
  }
}

// Remove duplicates
const uniquePos = [];
positions.forEach(p => {
  if (!uniquePos.some(q => p.distanceTo(q) < 0.01)) uniquePos.push(p);
});

// Create Nodes (small points)
const pointsGeometry = new THREE.BufferGeometry().setFromPoints(uniquePos);
const points = new THREE.Points(pointsGeometry, nodeMaterial);
scene.add(points);

// Create Edges
for (let i = 0; i < uniquePos.length; i++) {
  for (let j = i + 1; j < uniquePos.length; j++) {
    const dist = uniquePos[i].distanceTo(uniquePos[j]);
    if (Math.abs(dist - nnDistance) < 0.1) {
      const lineGeo = new THREE.BufferGeometry().setFromPoints([uniquePos[i], uniquePos[j]]);
      const line = new THREE.Line(lineGeo, bondMaterial);
      scene.add(line);
    }
  }
}

// Animation
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// Resize handler
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
