<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Springy Grid — Adjustable Physics</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: Arial, sans-serif; }
        canvas { display: block; }
        .controls {
            position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.95);
            padding: 15px 20px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 100; color: #222; min-width: 360px;
        }
        label { display: block; margin: 8px 0 4px; font-weight: bold; }
        input[type="range"] { width: 100%; }
        button { margin: 8px 0; padding: 10px; background: #0066cc; color: white; border: none; border-radius: 6px; width: 100%; cursor: pointer; }
        button:hover { background: #0055aa; }
        .pause-btn.running { background: #aa0000; }
        .value { font-weight: normal; color: #0066cc; }
    </style>
</head>
<body>
    <div class="controls">
        <h2>2D Springy Grid — Adjustable Physics</h2>

        <label>Grid Size: 
            <input id="gridSize" type="number" value="9" min="5" max="21" step="2">
        </label>
        <label>Edge Length: 
            <input id="edgeLength" type="number" value="72" min="40" max="140">
        </label>

        <hr style="margin:12px 0;">

        <label>Damping: <span id="dampValue" class="value">0.93</span></label>
        <input type="range" id="dampSlider" min="0.7" max="0.98" step="0.01" value="0.93">

        <label>Repulsion: <span id="repValue" class="value">620</span></label>
        <input type="range" id="repSlider" min="100" max="3000" step="50" value="620">

        <label>Spring Strength: <span id="springValue" class="value">0.22</span></label>
        <input type="range" id="springSlider" min="0.05" max="0.6" step="0.01" value="0.22">

        <label>Wiggle Force: <span id="wiggleValue" class="value">0.00</span></label>
        <input type="range" id="wiggleSlider" min="0" max="0.8" step="0.02" value="0">

        <button onclick="generateGrid()">Generate New Grid</button>
        <button id="pauseBtn" onclick="togglePause()" class="pause-btn">⏸ Pause</button>

        <div id="stats" style="margin-top:12px; font-size:14px;"></div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const RULES = {
            EDGE_LENGTH: 72,
            REPULSION: 620,
            SPRING_STRENGTH: 0.22,
            DAMPING: 0.93,
            WIGGLE_FORCE: 0.00,
            CENTERING_STRENGTH: 0.008,
            WALL_BOUNCE: 0.35
        };

        let canvas, ctx;
        let nodes = [];
        let edges = [];
        let adjacency = [];
        let fixedCenterIndex = -1;
        let isPaused = false;
        let draggedNode = null;

        function initCanvas() {
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
            window.addEventListener('resize', resize);
            resize();
        }

        function generateGrid() {
            nodes = []; edges = []; adjacency = [];

            const size = parseInt(document.getElementById('gridSize').value) || 9;
            RULES.EDGE_LENGTH = parseInt(document.getElementById('edgeLength').value) || 72;

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const spacing = RULES.EDGE_LENGTH;

            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    nodes.push({
                        id: nodes.length + 1,
                        x: cx + (x - (size-1)/2) * spacing,
                        y: cy + (y - (size-1)/2) * spacing,
                        vx: 0,
                        vy: 0
                    });
                    adjacency.push([]);
                }
            }

            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const i = y * size + x;
                    if (x < size-1) {
                        const j = i + 1;
                        adjacency[i].push(j); adjacency[j].push(i);
                        edges.push({a:i, b:j});
                    }
                    if (y < size-1) {
                        const j = i + size;
                        adjacency[i].push(j); adjacency[j].push(i);
                        edges.push({a:i, b:j});
                    }
                }
            }

            fixedCenterIndex = Math.floor(nodes.length / 2);
            updateStats();
        }

        function updateStats() {
            document.getElementById('stats').innerHTML = 
                `<b>${nodes.length} nodes</b> • <b>${edges.length} edges</b>`;
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        function setupMouse() {
            canvas.addEventListener('mousedown', e => {
                const pos = getMousePos(e);
                for (let i = 0; i < nodes.length; i++) {
                    if (i === fixedCenterIndex) continue;
                    if (Math.hypot(nodes[i].x - pos.x, nodes[i].y - pos.y) < 35) {
                        draggedNode = i;
                        return;
                    }
                }
            });

            window.addEventListener('mousemove', e => {
                if (draggedNode === null) return;
                const pos = getMousePos(e);
                nodes[draggedNode].x = pos.x;
                nodes[draggedNode].y = pos.y;
            });

            window.addEventListener('mouseup', () => {
                if (draggedNode !== null) {
                    nodes[draggedNode].vx *= 0.7;
                    nodes[draggedNode].vy *= 0.7;
                }
                draggedNode = null;
            });
        }

        function simulate() {
            if (isPaused) return;
            const r = RULES;

            for (let i = 0; i < nodes.length; i++) {
                if (i === fixedCenterIndex) continue;
                const n = nodes[i];

                n.vx *= r.DAMPING;
                n.vy *= r.DAMPING;

                // Repulsion
                for (let j = 0; j < nodes.length; j++) {
                    if (i === j) continue;
                    const dx = n.x - nodes[j].x;
                    const dy = n.y - nodes[j].y;
                    const distSq = dx*dx + dy*dy || 1;
                    const f = r.REPULSION / distSq;
                    n.vx += dx * f;
                    n.vy += dy * f;
                }

                // Springs
                for (let j of adjacency[i]) {
                    const dx = nodes[j].x - n.x;
                    const dy = nodes[j].y - n.y;
                    const dist = Math.hypot(dx, dy) || 1;
                    const stretch = dist - r.EDGE_LENGTH;
                    const fx = (dx / dist) * stretch * r.SPRING_STRENGTH;
                    const fy = (dy / dist) * stretch * r.SPRING_STRENGTH;
                    n.vx += fx;
                    n.vy += fy;
                }

                n.vx += (Math.random() - 0.5) * r.WIGGLE_FORCE;
                n.vy += (Math.random() - 0.5) * r.WIGGLE_FORCE;

                n.vx -= n.x * r.CENTERING_STRENGTH;
                n.vy -= n.y * r.CENTERING_STRENGTH;
            }

            // Apply movement
            for (let i = 0; i < nodes.length; i++) {
                if (i === fixedCenterIndex) continue;
                const n = nodes[i];
                n.x += n.vx;
                n.y += n.vy;

                const margin = 40;
                if (n.x < margin) { n.x = margin; n.vx = -n.vx * r.WALL_BOUNCE; }
                if (n.x > canvas.width - margin) { n.x = canvas.width - margin; n.vx = -n.vx * r.WALL_BOUNCE; }
                if (n.y < margin) { n.y = margin; n.vy = -n.vy * r.WALL_BOUNCE; }
                if (n.y > canvas.height - margin) { n.y = canvas.height - margin; n.vy = -n.vy * r.WALL_BOUNCE; }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#77aaff';
            ctx.lineWidth = 3.2;
            for (let e of edges) {
                const a = nodes[e.a], b = nodes[e.b];
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
            }

            for (let i = 0; i < nodes.length; i++) {
                const n = nodes[i];
                ctx.fillStyle = (i === fixedCenterIndex) ? '#ffaa33' : '#44aaff';
                ctx.beginPath();
                ctx.arc(n.x, n.y, 13, 0, Math.PI*2);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 13px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(n.id, n.x, n.y);
            }

            if (draggedNode !== null) {
                const n = nodes[draggedNode];
                ctx.strokeStyle = '#ffcc00';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.arc(n.x, n.y, 20, 0, Math.PI*2);
                ctx.stroke();
            }
        }

        function animate() {
            simulate();
            draw();
            requestAnimationFrame(animate);
        }

        function togglePause() {
            isPaused = !isPaused;
            const btn = document.getElementById('pauseBtn');
            btn.textContent = isPaused ? '▶ Resume' : '⏸ Pause';
            btn.classList.toggle('running', isPaused);
        }

        window.onload = () => {
            initCanvas();
            setupMouse();
            generateGrid();
            animate();

            // Live sliders
            const sliders = {
                damp:   {id: 'dampSlider',   valId: 'dampValue',   rule: 'DAMPING'},
                rep:    {id: 'repSlider',    valId: 'repValue',    rule: 'REPULSION'},
                spring: {id: 'springSlider', valId: 'springValue', rule: 'SPRING_STRENGTH'},
                wiggle: {id: 'wiggleSlider', valId: 'wiggleValue', rule: 'WIGGLE_FORCE'}
            };

            Object.values(sliders).forEach(s => {
                const slider = document.getElementById(s.id);
                const display = document.getElementById(s.valId);
                slider.addEventListener('input', () => {
                    RULES[s.rule] = parseFloat(slider.value);
                    display.textContent = RULES[s.rule].toFixed(s.rule === 'REPULSION' ? 0 : 2);
                });
            });
        };
    </script>
</body>
</html>
