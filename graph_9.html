<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Growing Graph - Tetrahedral Spawn</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: Arial, sans-serif; }
        canvas { display: block; }
        .controls {
            position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.95);
            padding: 15px 20px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 100; color: #222; min-width: 360px;
        }
        button { margin: 6px 0; padding: 10px; background: #0066cc; color: white; border: none; border-radius: 6px; width: 100%; cursor: pointer; }
        button:hover { background: #0055aa; }
        .step-btn { background: #00aa66; font-weight: bold; }
        .step-btn:hover { background: #009955; }
        #runBtn.running { background: #aa0000; }
    </style>
</head>
<body>
    <div class="controls">
        <h2>3D Growing Graph — Tetrahedral Spawn</h2>

        <label>Target degree per node: 
            <input id="targetDegree" type="number" value="4" min="1" max="8">
        </label>
        
        <label>Wiggle Speed: <span id="speedValue">0.35</span></label>
        <input type="range" id="speedSlider" min="0" max="2" step="0.05" value="0.35">

        <button onclick="generateGraph()">Reset Graph</button>
        
        <div style="display:flex; gap:8px;">
            <button onclick="step()" class="step-btn">STEP (Full Degree + Repulsion)</button>
            <button id="runBtn" onclick="toggleRun()">▶ Run</button>
        </div>
        
        <button onclick="resetView()">Reset Camera</button>

        <div id="stats" style="margin-top:12px; font-size:14px; line-height:1.4;"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
        // ==================== EDITABLE RULES ====================
        const RULES = {
            TARGET_DEGREE: 4,           // nodes try to reach exactly this degree
            EDGE_LENGTH: 21,            // fixed spring length between connected nodes
            NEW_NODE_DISTANCE: 21,      // distance from parent to new children
            WIGGLE_FORCE: 0.35,         // global random angle change
            CENTERING_FORCE: 0.028,
            REPULSION: 680,
            SPRING_STRENGTH: 0.19,
            DAMPING: 0.79,
            SIBLING_REPULSION_ITERATIONS: 45   // ← controls how "tetrahedral" the spawn looks
        };
        // =====================================================

        let scene, camera, renderer;
        let nodeMeshes = [], edgeLines = [], labelSprites = [];
        let nodesData = [];
        let adjacency = [];
        let currentN = 1;
        let isRunning = false;
        let runInterval = null;

        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x112233);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 90, 200);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(50, 120, 80);
            scene.add(light);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function createLabel(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 50px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 64, 36);

            const tex = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex }));
            sprite.scale.set(7, 3.5, 1);
            return sprite;
        }

        // Helper: place K new children at maximal distance from each other (repulsion on sphere)
        function generateEvenlySpacedDirections(count, radius) {
            if (count === 0) return [];

            const dirs = [];
            for (let i = 0; i < count; i++) {
                dirs.push(new THREE.Vector3(
                    Math.random() - 0.5,
                    Math.random() - 0.5,
                    Math.random() - 0.5
                ).normalize());
            }

            // Repel siblings from each other (this gives nice tetrahedron for 4, etc.)
            for (let iter = 0; iter < RULES.SIBLING_REPULSION_ITERATIONS; iter++) {
                for (let i = 0; i < count; i++) {
                    for (let j = i + 1; j < count; j++) {
                        const diff = new THREE.Vector3().subVectors(dirs[i], dirs[j]);
                        const dist = diff.length() || 0.01;
                        const force = 1.2 / (dist * dist);           // strong repulsion
                        diff.normalize().multiplyScalar(force);
                        dirs[i].add(diff);
                        dirs[j].sub(diff);
                    }
                }
                dirs.forEach(d => d.normalize());   // stay on unit sphere
            }

            return dirs.map(d => d.multiplyScalar(radius));
        }

        function generateGraph() {
            nodeMeshes.forEach(m => scene.remove(m));
            edgeLines.forEach(l => scene.remove(l));
            labelSprites.forEach(s => scene.remove(s));
            
            nodeMeshes = []; edgeLines = []; labelSprites = []; nodesData = []; adjacency = [];
            currentN = 1;

            RULES.TARGET_DEGREE = parseInt(document.getElementById('targetDegree').value) || 4;

            // Central node
            nodesData.push({ id: 1, position: new THREE.Vector3(0,0,0), velocity: new THREE.Vector3() });
            adjacency.push([]);

            const centerMesh = new THREE.Mesh(
                new THREE.SphereGeometry(1.7, 32, 32),
                new THREE.MeshPhongMaterial({ color: 0xffaa33 })
            );
            centerMesh.position.set(0,0,0);
            scene.add(centerMesh);
            nodeMeshes.push(centerMesh);

            const centerLabel = createLabel("1");
            centerLabel.position.set(0, 4.5, 0);
            scene.add(centerLabel);
            labelSprites.push(centerLabel);

            updateStats();
        }

        function updateStats() {
            const edges = edgeLines.length;
            const under = nodesData.filter((_, i) => adjacency[i].length < RULES.TARGET_DEGREE).length;
            document.getElementById('stats').innerHTML = 
                `<b>${currentN} nodes</b> • <b>${edges} edges</b><br>` +
                `${under} nodes still need connections (target = ${RULES.TARGET_DEGREE})`;
        }

        // ==================== ONE STEP: every node spawns ALL missing children with maximal spacing ====================
        function step() {
            if (currentN >= 400) return;

            const lineMat = new THREE.LineBasicMaterial({ color: 0x88ccff, transparent: true, opacity: 0.75 });
            const currentNodes = currentN;   // freeze the list for this step

            for (let parentIdx = 0; parentIdx < currentNodes; parentIdx++) {
                const missing = RULES.TARGET_DEGREE - adjacency[parentIdx].length;
                if (missing <= 0) continue;

                const parentPos = nodesData[parentIdx].position;
                const siblingOffsets = generateEvenlySpacedDirections(missing, RULES.NEW_NODE_DISTANCE);

                for (let k = 0; k < missing; k++) {
                    const newIndex = currentN;
                    const newId = currentN + 1;
                    currentN++;

                    const newPos = parentPos.clone().add(siblingOffsets[k]);

                    // Add node
                    nodesData.push({ id: newId, position: newPos, velocity: new THREE.Vector3() });
                    adjacency.push([]);

                    // Connect
                    adjacency[parentIdx].push(newIndex);
                    adjacency[newIndex].push(parentIdx);

                    // Edge
                    const geo = new THREE.BufferGeometry().setFromPoints([parentPos, newPos]);
                    const line = new THREE.Line(geo, lineMat);
                    scene.add(line);
                    edgeLines.push({ line, a: parentIdx, b: newIndex });

                    // Visuals
                    const nodeMesh = new THREE.Mesh(
                        new THREE.SphereGeometry(0.85, 24, 24),
                        new THREE.MeshPhongMaterial({ color: 0x44ddff })
                    );
                    nodeMesh.position.copy(newPos);
                    scene.add(nodeMesh);
                    nodeMeshes.push(nodeMesh);

                    const label = createLabel(newId.toString());
                    label.position.copy(newPos);
                    label.position.y += 3;
                    scene.add(label);
                    labelSprites.push(label);
                }
            }

            updateStats();
        }

        function toggleRun() {
            const btn = document.getElementById('runBtn');
            isRunning = !isRunning;
            if (isRunning) {
                btn.textContent = "⏹ Pause";
                btn.classList.add('running');
                runInterval = setInterval(step, 450);
            } else {
                btn.textContent = "▶ Run";
                btn.classList.remove('running');
                clearInterval(runInterval);
            }
        }

        function updateGraph() {
            const r = RULES;
            for (let i = 1; i < nodesData.length; i++) {
                const node = nodesData[i];
                node.velocity.multiplyScalar(r.DAMPING);

                // Repulsion
                for (let j = 0; j < nodesData.length; j++) {
                    if (i === j) continue;
                    const diff = new THREE.Vector3().subVectors(node.position, nodesData[j].position);
                    const distSq = diff.lengthSq() || 1;
                    diff.normalize().multiplyScalar(r.REPULSION / distSq);
                    node.velocity.add(diff);
                }

                // Springs (fixed edge length)
                for (let n of adjacency[i]) {
                    const diff = new THREE.Vector3().subVectors(nodesData[n].position, node.position);
                    const dist = diff.length() || 1;
                    const dir = diff.normalize();
                    node.velocity.add(dir.multiplyScalar((dist - r.EDGE_LENGTH) * r.SPRING_STRENGTH));
                }

                // Random wiggle
                node.velocity.x += (Math.random() - 0.5) * r.WIGGLE_FORCE;
                node.velocity.y += (Math.random() - 0.5) * r.WIGGLE_FORCE;
                node.velocity.z += (Math.random() - 0.5) * r.WIGGLE_FORCE;

                node.velocity.sub(node.position.clone().multiplyScalar(r.CENTERING_FORCE));
                node.position.add(node.velocity);
            }

            // Update visuals
            for (let i = 1; i < nodeMeshes.length; i++) {
                nodeMeshes[i].position.copy(nodesData[i].position);
                labelSprites[i].position.copy(nodesData[i].position);
                labelSprites[i].position.y += 3;
            }

            // Update edges
            for (let edge of edgeLines) {
                const p = [nodesData[edge.a].position, nodesData[edge.b].position];
                edge.line.geometry.setFromPoints(p);
                edge.line.geometry.attributes.position.needsUpdate = true;
            }
        }

        let isDragging = false, prevX = 0, prevY = 0;
        function setupControls() {
            const canvas = renderer.domElement;
            canvas.addEventListener('mousedown', e => { if (e.button === 0) isDragging = true; prevX = e.clientX; prevY = e.clientY; });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', e => {
                if (!isDragging) return;
                const dx = (e.clientX - prevX) * 0.0023;
                const dy = (e.clientY - prevY) * 0.0023;
                const dist = camera.position.length();
                let theta = Math.atan2(camera.position.x, camera.position.z);
                let phi = Math.acos(camera.position.y / dist);
                theta += dx;
                phi = Math.max(0.1, Math.min(Math.PI - 0.1, phi + dy));
                camera.position.x = dist * Math.sin(phi) * Math.sin(theta);
                camera.position.z = dist * Math.sin(phi) * Math.cos(theta);
                camera.position.y = dist * Math.cos(phi);
                camera.lookAt(0, 0, 0);
                prevX = e.clientX; prevY = e.clientY;
            });
            window.addEventListener('wheel', e => {
                let d = camera.position.length();
                d = Math.max(60, Math.min(700, d + e.deltaY * 0.3));
                camera.position.normalize().multiplyScalar(d);
            });
        }

        function resetView() {
            camera.position.set(0, 90, 200);
            camera.lookAt(0, 0, 0);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (nodesData.length > 0) updateGraph();
            renderer.render(scene, camera);
        }

        window.onload = () => {
            initThree();
            setupControls();
            generateGraph();
            animate();

            const slider = document.getElementById('speedSlider');
            const val = document.getElementById('speedValue');
            slider.addEventListener('input', () => {
                RULES.WIGGLE_FORCE = parseFloat(slider.value);
                val.textContent = RULES.WIGGLE_FORCE.toFixed(2);
            });

            document.getElementById('targetDegree').addEventListener('change', () => {
                RULES.TARGET_DEGREE = parseInt(document.getElementById('targetDegree').value) || 4;
            });
        };
    </script>
</body>
</html>
