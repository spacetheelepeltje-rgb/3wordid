<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>World Hair Color Distribution</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
    }
    h1 {
      color: #2c3e50;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #7f8c8d;
      margin-bottom: 30px;
    }
    .chart-container {
      position: relative;
      width: 90%;
      max-width: 620px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>
<div class="logo">
            <center><a href="https://www.3wordid.com">Create your own 3 Word Id!</a></center>
        </div>
<h1>Worldwide Natural Hair Color Distribution</h1>
<p class="subtitle">(rough global estimates – adult population)</p>

<div class="chart-container">
  <canvas id="hairChart"></canvas>
</div>

<script>
// Approximate global percentages (very rough consensus from various anthropological & genetic sources)
const data = {
  labels: [
    'Black / Very Dark Brown',
    'Dark Brown',
    'Brown / Medium Brown',
    'Light Brown',
    'Blonde / Light Blonde',
    'Red / Auburn',
    'Other / Grey (natural)'
  ],
  datasets: [{
    label: 'Approximate % of world population',
    data: [75, 11, 8, 2, 2, 1, 1],
    backgroundColor: [
      '#1a0d00',         // Black / very dark brown
      '#3d2a1e',         // Dark brown
      '#8b5a2b',         // Medium brown
      '#c19a6b',         // Light brown
      '#f4d03f',         // Blonde
      '#c0392b',         // Red / auburn
      '#95a5a6'          // Grey (natural – older population)
    ],
    borderColor: [
      '#0f0700',
      '#2a1c14',
      '#6b4423',
      '#a67c52',
      '#d4ac2f',
      '#a93226',
      '#7f8c8d'
    ],
    borderWidth: 1,
    hoverOffset: 24
  }]
};

const config = {
  type: 'pie',
  data: data,
  options: {
    responsive: true,
    plugins: {
      legend: {
        position: 'bottom',
        labels: {
          padding: 20,
          font: { size: 14 }
        }
      },
      tooltip: {
        callbacks: {
          label: function(context) {
            let label = context.label || '';
            let value = context.parsed || 0;
            return ` ${label}: ${value}%`;
          }
        }
      },
      title: {
        display: true,
        text: 'Estimated Global Natural Hair Color Prevalence',
        font: { size: 18 },
        padding: { top: 10, bottom: 20 }
      }
    },
    animation: {
      duration: 1800,
      easing: 'easeOutQuart'
    }
  }
};

const ctx = document.getElementById('hairChart').getContext('2d');
new Chart(ctx, config);
</script>
<center><a href="https://www.3wordid.com">Go back and create your own 3 Word Id!</a></center>
</body>
</html>
