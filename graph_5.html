<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Dynamic Star Graph - Centered</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: Arial, sans-serif; }
        canvas { display: block; }
        .controls {
            position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.95);
            padding: 15px 20px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 100; color: #222; min-width: 300px;
        }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input[type="range"] { width: 100%; }
        button { margin-top: 12px; padding: 10px; background: #0066cc; color: white; border: none; border-radius: 6px; width: 100%; cursor: pointer; }
        button:hover { background: #0055aa; }
    </style>
</head>
<body>
    <div class="controls">
        <h2>3D Star Graph (Centered)</h2>
        
        <label>Total Nodes (including center): <input id="numNodes" type="number" value="40" min="5" max="150"></label>
        
        <label>Wiggle Speed: <span id="speedValue">0.25</span></label>
        <input type="range" id="speedSlider" min="0" max="2" step="0.05" value="0.25">
        
        <button onclick="generateGraph()">Generate New Graph</button>
        <button onclick="resetView()">Reset Camera</button>
        
        <div id="stats"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let nodeMeshes = [], edgeLines = [], labelSprites = [];
        let nodesData = [];           // [0] is always the fixed center
        let targetN = 40;
        let currentN = 1;             // starts with only the center
        const EDGE_LENGTH = 22;       // fixed distance from center

        let randomForce = 0.25;       // ← much slower by default

        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x112233);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 50, 130);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(30, 80, 60);
            scene.add(light);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function createLabel(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 52px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 64, 36);

            const tex = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex }));
            sprite.scale.set(7, 3.5, 1);
            return sprite;
        }

        function generateGraph() {
            // Clear everything
            nodeMeshes.forEach(m => scene.remove(m));
            edgeLines.forEach(l => scene.remove(l));
            labelSprites.forEach(s => scene.remove(s));

            nodeMeshes = []; edgeLines = []; labelSprites = []; nodesData = [];

            targetN = parseInt(document.getElementById('numNodes').value) || 40;
            currentN = 1;

            // === 1. Create the FIXED central node (node #1) ===
            const center = {
                id: 1,
                position: new THREE.Vector3(0, 0, 0),
                isCenter: true
            };
            nodesData.push(center);

            // Visual center (bigger & different color)
            const centerGeo = new THREE.SphereGeometry(1.6, 32, 32);
            const centerMat = new THREE.MeshPhongMaterial({ color: 0xffaa33, shininess: 40 });
            const centerMesh = new THREE.Mesh(centerGeo, centerMat);
            centerMesh.position.copy(center.position);
            scene.add(centerMesh);
            nodeMeshes.push(centerMesh);

            const centerLabel = createLabel("1");
            centerLabel.position.copy(center.position);
            centerLabel.position.y += 4;
            scene.add(centerLabel);
            labelSprites.push(centerLabel);

            document.getElementById('stats').innerHTML = 
                `Starting with center node • Will spawn ${targetN-1} more nodes...`;

            // First peripheral node will be spawned in the animation loop
        }

        function addNewPeripheralNode() {
            if (currentN >= targetN) return;

            const newId = currentN + 1;
            currentN = newId;

            // Random direction from center
            const dir = new THREE.Vector3(
                Math.random() - 0.5,
                Math.random() - 0.5,
                Math.random() - 0.5
            ).normalize();

            const position = dir.multiplyScalar(EDGE_LENGTH);

            nodesData.push({
                id: newId,
                position: position,
                isCenter: false
            });

            // Visual node (smaller)
            const nodeGeo = new THREE.SphereGeometry(0.8, 24, 24);
            const nodeMat = new THREE.MeshPhongMaterial({ color: 0x44ddff, shininess: 30 });
            const mesh = new THREE.Mesh(nodeGeo, nodeMat);
            mesh.position.copy(position);
            scene.add(mesh);
            nodeMeshes.push(mesh);

            // Label
            const label = createLabel(newId.toString());
            label.position.copy(position);
            label.position.y += 2.8;
            scene.add(label);
            labelSprites.push(label);

            // Edge from center to this node
            const lineMat = new THREE.LineBasicMaterial({ color: 0xaaddff, transparent: true, opacity: 0.8 });
            const points = [nodesData[0].position, position];
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(geo, lineMat);
            scene.add(line);
            edgeLines.push({line, from: 0, to: nodesData.length - 1});

            document.getElementById('stats').innerHTML = 
                `<b>${currentN}/${targetN} nodes</b> • Fixed center • Edges = ${currentN-1}`;
        }

        // ==================== UPDATE: Spawn + Slow Random Angle Changes ====================
        function updateGraph() {
            // === Spawn new nodes "in every step" (gradually) ===
            if (currentN < targetN && Math.random() < 0.07) {   // ≈ 1 new node every ~14 frames
                addNewPeripheralNode();
            }

            // === Only wiggle peripheral nodes (center stays fixed) ===
            for (let i = 1; i < nodesData.length; i++) {
                const node = nodesData[i];

                // Small random rotation around the center (changes angle slowly)
                const axis = new THREE.Vector3(
                    (Math.random() - 0.5) * randomForce,
                    (Math.random() - 0.5) * randomForce,
                    (Math.random() - 0.5) * randomForce
                ).normalize();

                // Rotate the vector from center → node
                const vectorFromCenter = node.position.clone();
                vectorFromCenter.applyAxisAngle(axis, 0.008 * randomForce); // slow rotation
                node.position.copy(vectorFromCenter.normalize().multiplyScalar(EDGE_LENGTH));
            }

            // Update visuals
            for (let i = 0; i < nodeMeshes.length; i++) {
                nodeMeshes[i].position.copy(nodesData[i].position);
                labelSprites[i].position.copy(nodesData[i].position);
                if (i === 0) labelSprites[i].position.y += 4;           // center label higher
                else         labelSprites[i].position.y += 2.8;
            }

            // Update edge lines (all point to center)
            for (let edge of edgeLines) {
                const points = [
                    nodesData[edge.from].position,
                    nodesData[edge.to].position
                ];
                edge.line.geometry.setFromPoints(points);
                edge.line.geometry.attributes.position.needsUpdate = true;
            }
        }

        // Camera controls (slower rotation)
        let isDragging = false, prevX = 0, prevY = 0;
        function setupControls() {
            const canvas = renderer.domElement;
            canvas.addEventListener('mousedown', e => { 
                if (e.button === 0) isDragging = true; 
                prevX = e.clientX; prevY = e.clientY; 
            });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', e => {
                if (!isDragging) return;
                const dx = (e.clientX - prevX) * 0.002;   // ← much slower rotation
                const dy = (e.clientY - prevY) * 0.002;
                const dist = camera.position.length();
                let theta = Math.atan2(camera.position.x, camera.position.z);
                let phi = Math.acos(camera.position.y / dist);
                theta += dx;
                phi = Math.max(0.1, Math.min(Math.PI - 0.1, phi + dy));
                camera.position.x = dist * Math.sin(phi) * Math.sin(theta);
                camera.position.z = dist * Math.sin(phi) * Math.cos(theta);
                camera.position.y = dist * Math.cos(phi);
                camera.lookAt(0, 0, 0);
                prevX = e.clientX; prevY = e.clientY;
            });
            window.addEventListener('wheel', e => {
                let d = camera.position.length();
                d = Math.max(40, Math.min(400, d + e.deltaY * 0.25));
                camera.position.normalize().multiplyScalar(d);
            });
        }

        function resetView() {
            camera.position.set(0, 50, 130);
            camera.lookAt(0, 0, 0);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (nodesData.length > 0) updateGraph();
            renderer.render(scene, camera);
        }

        // Slider
        window.onload = () => {
            initThree();
            setupControls();
            generateGraph();
            animate();

            const slider = document.getElementById('speedSlider');
            const valueDisplay = document.getElementById('speedValue');

            slider.addEventListener('input', () => {
                randomForce = parseFloat(slider.value);
                valueDisplay.textContent = randomForce.toFixed(2);
            });
        };
    </script>
</body>
</html>
