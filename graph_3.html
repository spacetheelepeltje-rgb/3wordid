<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Graph Visualizer - Fixed</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: Arial, sans-serif; }
        canvas { display: block; }
        .controls {
            position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.95);
            padding: 15px 20px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 100; color: #222; min-width: 260px;
        }
        button { margin-top: 12px; padding: 12px; background: #0066cc; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; width: 100%; }
        button:hover { background: #0055aa; }
        #error { color: #d00; font-weight: bold; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="controls">
        <h2>3D Graph Visualizer</h2>
        <label>Nodes: <input id="numNodes" type="number" value="40" min="5" max="200"></label>
        <label>Edges per node: <input id="degree" type="number" value="4" min="1" max="15"></label>
        <button onclick="generateGraph()">Generate New Graph</button>
        <div id="stats">Loading Three.js...</div>
        <div id="error"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
        let scene, camera, renderer;

        function showError(msg) {
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').textContent = msg;
            console.error(msg);
        }

        function initThree() {
            try {
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x112233);

                camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 30, 80);

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                document.body.appendChild(renderer.domElement);

                // Lights
                scene.add(new THREE.AmbientLight(0xffffff, 0.7));
                const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
                dirLight.position.set(50, 100, 50);
                scene.add(dirLight);

                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });

                document.getElementById('stats').textContent = 'Three.js loaded successfully ✓';
                return true;
            } catch (e) {
                showError('Failed to initialize Three.js: ' + e.message);
                return false;
            }
        }

        function generateGraph() {
            if (!renderer) {
                showError('Renderer not initialized. Please refresh the page.');
                return;
            }

            // Clear old objects
            while(scene.children.length > 0) scene.remove(scene.children[0]);

            const N = parseInt(document.getElementById('numNodes').value) || 30;
            const degree = parseInt(document.getElementById('degree').value) || 4;

            // Simple sphere nodes
            const nodeGeo = new THREE.SphereGeometry(1.5, 32, 32);
            const nodeMat = new THREE.MeshPhongMaterial({ color: 0x00aaff, shininess: 10 });

            for (let i = 0; i < N; i++) {
                const node = new THREE.Mesh(nodeGeo, nodeMat);
                node.position.x = (Math.random() - 0.5) * 60;
                node.position.y = (Math.random() - 0.5) * 60;
                node.position.z = (Math.random() - 0.5) * 60;
                scene.add(node);

                // Optional: add number as small text (using sprite)
                const canvas = document.createElement('canvas');
                canvas.width = 64; canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = 'white';
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText((i+1).toString(), 32, 45);

                const tex = new THREE.CanvasTexture(canvas);
                const spriteMat = new THREE.SpriteMaterial({ map: tex });
                const sprite = new THREE.Sprite(spriteMat);
                sprite.scale.set(6, 6, 1);
                sprite.position.copy(node.position);
                sprite.position.y += 3;
                scene.add(sprite);
            }

            // Simple random edges
            const lineMat = new THREE.LineBasicMaterial({ color: 0x88ccff, opacity: 0.5, transparent: true });
            for (let i = 0; i < N * degree / 2; i++) {
                const a = Math.floor(Math.random() * N);
                const b = Math.floor(Math.random() * N);
                if (a === b) continue;

                const points = [
                    scene.children[a*2].position,   // rough indexing
                    scene.children[b*2].position
                ];
                const geo = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(geo, lineMat);
                scene.add(line);
            }

            document.getElementById('stats').innerHTML = `<b>${N} nodes</b> • Random layout`;
        }

        function animate() {
            requestAnimationFrame(animate);
            if (renderer && scene && camera) {
                // Gentle rotation
                const t = Date.now() * 0.0003;
                camera.position.x = Math.sin(t) * 90;
                camera.position.z = Math.cos(t) * 90;
                camera.lookAt(0, 0, 0);
                renderer.render(scene, camera);
            }
        }

        // Start everything
        window.onload = function() {
            if (initThree()) {
                generateGraph();
                animate();
            }
        };
    </script>
</body>
</html>
