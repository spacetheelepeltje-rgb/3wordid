<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Springy Grid — Fixed Center</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: Arial, sans-serif; }
        canvas { display: block; }
        .controls {
            position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.95);
            padding: 15px 20px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 100; color: #222; min-width: 340px;
        }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input[type="range"] { width: 100%; }
        button { margin: 6px 0; padding: 10px; background: #0066cc; color: white; border: none; border-radius: 6px; width: 100%; cursor: pointer; }
        button:hover { background: #0055aa; }
        .pause-btn.running { background: #aa0000; }
    </style>
</head>
<body>
    <div class="controls">
        <h2>2D Springy Grid — Fixed Center</h2>

        <label>Grid Size (nodes per side): 
            <input id="gridSize" type="number" value="9" min="5" max="25" step="2">
        </label>
        <label>Target edge length: 
            <input id="edgeLength" type="number" value="65" min="30" max="120">
        </label>

        <label>Wiggle Force: <span id="wiggleValue">0.6</span></label>
        <input type="range" id="wiggleSlider" min="0" max="3" step="0.05" value="0.6">

        <button onclick="generateGrid()">Generate New Grid</button>
        <button id="pauseBtn" onclick="togglePause()" class="pause-btn">⏸ Pause Simulation</button>

        <div id="stats" style="margin-top:12px; font-size:14px;"></div>

        <div style="margin-top:12px; font-size:13px; color:#666;">
            Drag any node (except center) to perturb.<br>
            The grid will relax back with spring physics.
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        // ==================== RULES ====================
        const RULES = {
            EDGE_LENGTH: 65,
            REPULSION: 2200,
            SPRING_STRENGTH: 0.35,
            DAMPING: 0.84,
            WIGGLE_FORCE: 0.6,
            CENTERING_STRENGTH: 0.008
        };
        // ==============================================

        let canvas, ctx;
        let nodes = [];
        let edges = [];
        let adjacency = [];
        let fixedCenterIndex = -1;
        let isPaused = false;
        let draggedNode = null;

        function initCanvas() {
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            const resize = () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            };
            window.addEventListener('resize', resize);
            resize();
        }

        function generateGrid() {
            nodes = [];
            edges = [];
            adjacency = [];

            const size = parseInt(document.getElementById('gridSize').value) || 9;
            RULES.EDGE_LENGTH = parseInt(document.getElementById('edgeLength').value) || 65;

            const totalNodes = size * size;
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const spacing = RULES.EDGE_LENGTH;

            // Create grid nodes
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const idx = nodes.length;
                    nodes.push({
                        id: idx + 1,
                        x: cx + (x - (size-1)/2) * spacing,
                        y: cy + (y - (size-1)/2) * spacing,
                        vx: 0,
                        vy: 0
                    });
                    adjacency.push([]);
                }
            }

            // Connect horizontal and vertical edges (square grid)
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const i = y * size + x;

                    // Right
                    if (x < size - 1) {
                        const j = i + 1;
                        adjacency[i].push(j);
                        adjacency[j].push(i);
                        edges.push({a: i, b: j});
                    }
                    // Down
                    if (y < size - 1) {
                        const j = i + size;
                        adjacency[i].push(j);
                        adjacency[j].push(i);
                        edges.push({a: i, b: j});
                    }
                }
            }

            fixedCenterIndex = Math.floor(totalNodes / 2); // middle node

            updateStats();
        }

        function updateStats() {
            document.getElementById('stats').innerHTML = 
                `<b>${nodes.length} nodes</b> • <b>${edges.length} edges</b><br>` +
                `Center node is fixed (index ${fixedCenterIndex + 1})`;
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        function setupMouse() {
            canvas.addEventListener('mousedown', e => {
                if (e.button !== 0) return;
                const pos = getMousePos(e);
                let closest = -1;
                let minDist = Infinity;

                for (let i = 0; i < nodes.length; i++) {
                    if (i === fixedCenterIndex) continue;
                    const dx = nodes[i].x - pos.x;
                    const dy = nodes[i].y - pos.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < 35 && dist < minDist) {
                        minDist = dist;
                        closest = i;
                    }
                }
                if (closest !== -1) draggedNode = closest;
            });

            window.addEventListener('mousemove', e => {
                if (draggedNode === null) return;
                const pos = getMousePos(e);
                nodes[draggedNode].x = pos.x;
                nodes[draggedNode].y = pos.y;
            });

            window.addEventListener('mouseup', () => draggedNode = null);
        }

        function simulate() {
            if (isPaused) return;

            const r = RULES;

            for (let i = 0; i < nodes.length; i++) {
                if (i === fixedCenterIndex) continue; // fixed center

                const node = nodes[i];
                node.vx *= r.DAMPING;
                node.vy *= r.DAMPING;

                // Repulsion
                for (let j = 0; j < nodes.length; j++) {
                    if (i === j) continue;
                    const dx = node.x - nodes[j].x;
                    const dy = node.y - nodes[j].y;
                    const distSq = dx*dx + dy*dy || 1;
                    const f = r.REPULSION / distSq;
                    node.vx += dx * f;
                    node.vy += dy * f;
                }

                // Springs
                for (let j of adjacency[i]) {
                    const dx = nodes[j].x - node.x;
                    const dy = nodes[j].y - node.y;
                    const dist = Math.hypot(dx, dy) || 1;
                    const stretch = dist - r.EDGE_LENGTH;
                    const fx = (dx / dist) * stretch * r.SPRING_STRENGTH;
                    const fy = (dy / dist) * stretch * r.SPRING_STRENGTH;
                    node.vx += fx;
                    node.vy += fy;
                }

                // Wiggle
                node.vx += (Math.random() - 0.5) * r.WIGGLE_FORCE;
                node.vy += (Math.random() - 0.5) * r.WIGGLE_FORCE;

                // Center
                node.vx -= node.x * r.CENTERING_STRENGTH;
                node.vy -= node.y * r.CENTERING_STRENGTH;
            }

            // Apply movement
            for (let i = 0; i < nodes.length; i++) {
                if (i === fixedCenterIndex) continue;
                nodes[i].x += nodes[i].vx;
                nodes[i].y += nodes[i].vy;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Grid background
            ctx.strokeStyle = 'rgba(80,100,140,0.2)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 50) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 50) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Edges
            ctx.strokeStyle = '#77aaff';
            ctx.lineWidth = 3;
            for (let e of edges) {
                const a = nodes[e.a];
                const b = nodes[e.b];
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
            }

            // Nodes
            for (let i = 0; i < nodes.length; i++) {
                const n = nodes[i];
                ctx.fillStyle = (i === fixedCenterIndex) ? '#ffaa33' : '#44aaff';
                ctx.beginPath();
                ctx.arc(n.x, n.y, 13, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 13px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(n.id, n.x, n.y);
            }

            // Highlight dragged node
            if (draggedNode !== null) {
                const n = nodes[draggedNode];
                ctx.strokeStyle = '#ffcc00';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.arc(n.x, n.y, 19, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function animate() {
            simulate();
            draw();
            requestAnimationFrame(animate);
        }

        function togglePause() {
            isPaused = !isPaused;
            const btn = document.getElementById('pauseBtn');
            btn.textContent = isPaused ? '▶ Resume' : '⏸ Pause Simulation';
            btn.classList.toggle('running', isPaused);
        }

        window.onload = () => {
            initCanvas();
            setupMouse();
            generateGrid();
            animate();

            document.getElementById('wiggleSlider').addEventListener('input', e => {
                RULES.WIGGLE_FORCE = parseFloat(e.target.value);
                document.getElementById('wiggleValue').textContent = RULES.WIGGLE_FORCE.toFixed(1);
            });
        };
    </script>
</body>
</html>
