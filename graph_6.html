<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Growing Graph - Max Degree</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: Arial, sans-serif; }
        canvas { display: block; }
        .controls {
            position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.95);
            padding: 15px 20px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 100; color: #222; min-width: 320px;
        }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input[type="range"] { width: 100%; }
        button { margin-top: 12px; padding: 10px; background: #0066cc; color: white; border: none; border-radius: 6px; width: 100%; cursor: pointer; }
        button:hover { background: #0055aa; }
    </style>
</head>
<body>
    <div class="controls">
        <h2>3D Growing Graph</h2>
        
        <label>Total Nodes: <input id="numNodes" type="number" value="60" min="10" max="200"></label>
        <label>Max edges per node: <input id="maxDegree" type="number" value="4" min="2" max="8"></label>
        
        <label>Wiggle Speed: <span id="speedValue">0.35</span></label>
        <input type="range" id="speedSlider" min="0" max="2" step="0.05" value="0.35">
        
        <button onclick="generateGraph()">Generate New Graph</button>
        <button onclick="resetView()">Reset Camera</button>
        
        <div id="stats"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let nodeMeshes = [], edgeLines = [], labelSprites = [];
        let nodesData = [];
        let adjacency = [];
        let currentN = 1;
        let targetN = 60;
        let maxDegree = 4;
        const EDGE_LENGTH = 21;
        let randomForce = 0.35;

        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x112233);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 65, 150);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(40, 100, 80);
            scene.add(light);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function createLabel(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 50px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 64, 36);

            const tex = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex }));
            sprite.scale.set(7, 3.5, 1);
            return sprite;
        }

        function generateGraph() {
            // Clear everything
            nodeMeshes.forEach(m => scene.remove(m));
            edgeLines.forEach(l => scene.remove(l));
            labelSprites.forEach(s => scene.remove(s));
            
            nodeMeshes = []; edgeLines = []; labelSprites = []; nodesData = []; adjacency = [];

            targetN = parseInt(document.getElementById('numNodes').value) || 60;
            maxDegree = parseInt(document.getElementById('maxDegree').value) || 4;
            currentN = 1;

            // === FIXED CENTRAL NODE ===
            nodesData.push({
                id: 1,
                position: new THREE.Vector3(0, 0, 0),
                isCenter: true,
                velocity: new THREE.Vector3()
            });
            adjacency.push([]);

            // Visual center (bigger, orange)
            const centerMesh = new THREE.Mesh(
                new THREE.SphereGeometry(1.7, 32, 32),
                new THREE.MeshPhongMaterial({ color: 0xffaa33, shininess: 50 })
            );
            centerMesh.position.set(0, 0, 0);
            scene.add(centerMesh);
            nodeMeshes.push(centerMesh);

            const centerLabel = createLabel("1");
            centerLabel.position.set(0, 4.5, 0);
            scene.add(centerLabel);
            labelSprites.push(centerLabel);

            document.getElementById('stats').innerHTML = `Center node created • Growing to ${targetN} nodes (max ${maxDegree} edges/node)`;
        }

        function addNewNode() {
            if (currentN >= targetN) return;

            // Find all existing nodes that still have room for more edges
            const eligible = [];
            for (let i = 0; i < currentN; i++) {
                if (adjacency[i].length < maxDegree) eligible.push(i);
            }
            if (eligible.length === 0) return;

            const newIndex = currentN;           // index of the new node
            const newId = currentN + 1;
            currentN = newId;

            // New node connects to 1 .. maxDegree existing eligible nodes
            const numConnections = Math.min(maxDegree, eligible.length, 5);
            const shuffled = [...eligible].sort(() => Math.random() - 0.5);
            const targetIndices = shuffled.slice(0, numConnections);

            // Place new node near the average of its parents + small random offset
            let avgPos = new THREE.Vector3();
            targetIndices.forEach(i => avgPos.add(nodesData[i].position));
            avgPos.divideScalar(targetIndices.length || 1);

            const offset = new THREE.Vector3(
                (Math.random() - 0.5) * 12,
                (Math.random() - 0.5) * 12,
                (Math.random() - 0.5) * 12
            );
            const newPos = avgPos.add(offset).normalize().multiplyScalar(EDGE_LENGTH * 1.1);

            nodesData.push({
                id: newId,
                position: newPos,
                isCenter: false,
                velocity: new THREE.Vector3()
            });
            adjacency.push([]);

            // Create edges (respecting max degree)
            const lineMat = new THREE.LineBasicMaterial({ color: 0x88ccff, transparent: true, opacity: 0.75 });
            targetIndices.forEach(t => {
                adjacency[t].push(newIndex);
                adjacency[newIndex].push(t);

                const geo = new THREE.BufferGeometry().setFromPoints([
                    nodesData[t].position,
                    newPos
                ]);
                const line = new THREE.Line(geo, lineMat);
                scene.add(line);
                edgeLines.push({ line, a: t, b: newIndex });
            });

            // Visual node + label
            const nodeMesh = new THREE.Mesh(
                new THREE.SphereGeometry(0.85, 24, 24),
                new THREE.MeshPhongMaterial({ color: 0x44ddff, shininess: 30 })
            );
            nodeMesh.position.copy(newPos);
            scene.add(nodeMesh);
            nodeMeshes.push(nodeMesh);

            const label = createLabel(newId.toString());
            label.position.copy(newPos);
            label.position.y += 3;
            scene.add(label);
            labelSprites.push(label);

            document.getElementById('stats').innerHTML = 
                `<b>${currentN}/${targetN} nodes</b> • Last node attached to ${targetIndices.length} existing nodes`;
        }

        function updateGraph() {
            // === Spawn new nodes gradually (the graph "expands") ===
            if (currentN < targetN && Math.random() < 0.09) {
                addNewNode();
            }

            // === Physics for peripheral nodes only (center stays fixed) ===
            const repulsion = 680;
            const spring = 0.19;

            for (let i = 1; i < nodesData.length; i++) {
                const node = nodesData[i];
                node.velocity.multiplyScalar(0.79);

                // Repulsion from every other node
                for (let j = 0; j < nodesData.length; j++) {
                    if (i === j) continue;
                    const diff = new THREE.Vector3().subVectors(node.position, nodesData[j].position);
                    const distSq = diff.lengthSq() || 1;
                    const force = repulsion / distSq;
                    diff.normalize().multiplyScalar(force);
                    node.velocity.add(diff);
                }

                // Spring forces (fixed edge length) to its neighbors
                for (let n of adjacency[i]) {
                    const diff = new THREE.Vector3().subVectors(nodesData[n].position, node.position);
                    const dist = diff.length() || 1;
                    const dir = diff.normalize();
                    const stretch = dist - EDGE_LENGTH;
                    node.velocity.add(dir.multiplyScalar(stretch * spring));
                }

                // Random angle changes (wiggle)
                node.velocity.x += (Math.random() - 0.5) * randomForce;
                node.velocity.y += (Math.random() - 0.5) * randomForce;
                node.velocity.z += (Math.random() - 0.5) * randomForce;

                // Gentle centering
                node.velocity.sub(node.position.clone().multiplyScalar(0.028));

                node.position.add(node.velocity);
            }

            // Update visuals
            for (let i = 1; i < nodeMeshes.length; i++) {   // skip center
                nodeMeshes[i].position.copy(nodesData[i].position);
                labelSprites[i].position.copy(nodesData[i].position);
                labelSprites[i].position.y += 3;
            }

            // Update all edge lines
            for (let edge of edgeLines) {
                const points = [
                    nodesData[edge.a].position,
                    nodesData[edge.b].position
                ];
                edge.line.geometry.setFromPoints(points);
                edge.line.geometry.attributes.position.needsUpdate = true;
            }
        }

        // Camera controls (slow & smooth)
        let isDragging = false, prevX = 0, prevY = 0;
        function setupControls() {
            const canvas = renderer.domElement;
            canvas.addEventListener('mousedown', e => { if (e.button === 0) isDragging = true; prevX = e.clientX; prevY = e.clientY; });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', e => {
                if (!isDragging) return;
                const dx = (e.clientX - prevX) * 0.0023;
                const dy = (e.clientY - prevY) * 0.0023;
                const dist = camera.position.length();
                let theta = Math.atan2(camera.position.x, camera.position.z);
                let phi = Math.acos(camera.position.y / dist);
                theta += dx;
                phi = Math.max(0.1, Math.min(Math.PI - 0.1, phi + dy));
                camera.position.x = dist * Math.sin(phi) * Math.sin(theta);
                camera.position.z = dist * Math.sin(phi) * Math.cos(theta);
                camera.position.y = dist * Math.cos(phi);
                camera.lookAt(0, 0, 0);
                prevX = e.clientX; prevY = e.clientY;
            });
            window.addEventListener('wheel', e => {
                let d = camera.position.length();
                d = Math.max(50, Math.min(500, d + e.deltaY * 0.3));
                camera.position.normalize().multiplyScalar(d);
            });
        }

        function resetView() {
            camera.position.set(0, 65, 150);
            camera.lookAt(0, 0, 0);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (nodesData.length > 0) updateGraph();
            renderer.render(scene, camera);
        }

        window.onload = () => {
            initThree();
            setupControls();
            generateGraph();
            animate();

            const slider = document.getElementById('speedSlider');
            const valueDisplay = document.getElementById('speedValue');
            slider.addEventListener('input', () => {
                randomForce = parseFloat(slider.value);
                valueDisplay.textContent = randomForce.toFixed(2);
            });
        };
    </script>
</body>
</html>
