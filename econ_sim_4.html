<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5×5 Family Network - Fixed Total 10k</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
        canvas { background: white; border: 2px solid #333; box-shadow: 0 0 10px rgba(0,0,0,0.1); display: block; margin: 0 auto; }
        .controls {
            margin: 15px 0; padding: 15px; background: white; border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; gap: 15px; flex-wrap: wrap;
            align-items: center; max-width: 880px; margin-left: auto; margin-right: auto;
        }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
        label { display: flex; align-items: center; gap: 8px; font-weight: bold; }
        input[type="range"] { width: 180px; }
        #info { margin: 10px auto; padding: 12px; background: #fff; border: 1px solid #ddd; border-radius: 6px; max-width: 880px; min-height: 160px; font-size: 0.95em; line-height: 1.45; }
        h1 { text-align: center; }
        p.description { text-align: center; max-width: 880px; margin: 10px auto; color: #555; }
    </style>
</head>
<body>
    <h1>5×5 Family Network Simulation</h1>
    <p class="description">
        Total money fixed at <strong>10,000</strong> (conserved forever)<br>
        Only active connections (that carry money) are shown
    </p>
    
    <div class="controls">
        <button id="stepBtn">Step</button>
        <button id="runBtn">Run</button>
        <button id="resetBtn">Reset Simulation</button>
        <button id="randomizeBtn">Randomize Money</button>
        
        <label>
            Global Savings Rate:
            <input type="range" id="savingsSlider" min="0" max="100" value="30">
            <span id="savingsValue">30%</span>
        </label>
        <button id="applySavingsBtn">Apply to All</button>
        
        <span>Step: <span id="stepCount">0</span></span>
        <span>Total Liquid: <span id="totalLiquid">10000</span></span>
        <span>Total Savings: <span id="totalSavings">0</span></span>
        <span>Grand Total: <span id="grandTotal">10000</span></span>
    </div>

    <canvas id="canvas" width="850" height="650"></canvas>
    
    <div id="info">Click any node for detailed stats including income/distribution this step.</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const N = 5;
        const NUM_NODES = N * N;
        let nodes = [];
        let step = 0;
        let isRunning = false;
        let intervalId = null;
        let selectedNode = null;
        let activeSenders = new Set();

        function getCurrentSavingsRate() {
            return parseFloat(document.getElementById('savingsSlider').value) / 100;
        }

        function createNodes() {
            nodes = [];
            const cellSize = 110;
            const offsetX = 80;
            const offsetY = 60;
            const rate = getCurrentSavingsRate();
            
            for (let i = 0; i < NUM_NODES; i++) {
                const row = Math.floor(i / N);
                const col = i % N;
                nodes.push({
                    id: i,
                    x: offsetX + col * cellSize,
                    y: offsetY + row * cellSize,
                    savingsRate: rate,
                    reserves: 0,
                    savings: 0,
                    lastDistributed: 0,     // ← new: income sent this step
                    neighbors: new Set()
                });
            }
            createConnections();
            randomizeMoney();
        }

        function randomizeMoney() {
            for (let node of nodes) {
                node.reserves = 0;
                node.savings = 0;
                node.lastDistributed = 0;
            }

            const base = 10000 / NUM_NODES;
            let totalAssigned = 0;
            for (let node of nodes) {
                const variation = (Math.random() - 0.5) * 280;
                node.reserves = Math.max(50, Math.round(base + variation));
                totalAssigned += node.reserves;
            }

            const difference = 10000 - totalAssigned;
            if (difference !== 0) {
                const adjustment = Math.round(difference / NUM_NODES);
                for (let node of nodes) {
                    node.reserves = Math.max(50, node.reserves + adjustment);
                }
            }
        }

        function createConnections() {
            for (let node of nodes) node.neighbors.clear();
            for (let i = 0; i < NUM_NODES; i++) {
                const node = nodes[i];
                while (node.neighbors.size < 10) {
                    const j = Math.floor(Math.random() * NUM_NODES);
                    if (j !== i && !node.neighbors.has(j)) {
                        node.neighbors.add(j);
                        nodes[j].neighbors.add(i);
                    }
                }
            }
        }

        function simulationStep() {
            step++;
            document.getElementById('stepCount').textContent = step;
            activeSenders.clear();

            let received = new Array(NUM_NODES).fill(0);

            for (let i = 0; i < NUM_NODES; i++) {
                const node = nodes[i];
                node.lastDistributed = 0;

                if (node.reserves > 0.1) {
                    activeSenders.add(i);
                    
                    const toSave = node.reserves * node.savingsRate;
                    node.savings += toSave;
                    const toDistribute = node.reserves * (1 - node.savingsRate);
                    
                    if (toDistribute > 0.1 && node.neighbors.size > 0) {
                        const share = toDistribute / node.neighbors.size;
                        for (let neighId of node.neighbors) {
                            received[neighId] += share;
                        }
                        node.lastDistributed = Math.round(toDistribute);   // record income sent
                    }
                    node.reserves = 0;
                }
                
                if (node.reserves < 0.1 && node.savings > 0) {
                    const consume = Math.min(80, node.savings);
                    node.savings -= consume;
                    node.reserves += consume;
                }
            }

            let totalLiquid = 0;
            let totalSavings = 0;
            for (let i = 0; i < NUM_NODES; i++) {
                const node = nodes[i];
                node.reserves += received[i];
                totalLiquid += node.reserves;
                totalSavings += node.savings;
            }

            document.getElementById('totalLiquid').textContent = Math.round(totalLiquid);
            document.getElementById('totalSavings').textContent = Math.round(totalSavings);
            document.getElementById('grandTotal').textContent = Math.round(totalLiquid + totalSavings);
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let maxTotal = 0;
            for (let node of nodes) {
                const t = node.reserves + node.savings;
                if (t > maxTotal) maxTotal = t;
            }

            ctx.strokeStyle = '#555555';
            ctx.lineWidth = 1.5;
            for (let i of activeSenders) {
                const node = nodes[i];
                for (let j of node.neighbors) {
                    if (j > i || !activeSenders.has(j)) {
                        ctx.beginPath();
                        ctx.moveTo(node.x, node.y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.stroke();
                    }
                }
            }

            for (let i = 0; i < NUM_NODES; i++) {
                const node = nodes[i];
                const total = node.reserves + node.savings;
                const normalized = maxTotal > 0 ? Math.min(total / maxTotal, 1) : 0;
                const radius = 29 + normalized * 13;
                
                let isBroke = node.reserves <= 0 && node.savings <= 0;
                let fillColor = isBroke ? '#ff8800' : (node.reserves <= 0 ? '#223355' : '#1e3a8a');
                
                ctx.fillStyle = fillColor;
                ctx.beginPath();
                ctx.arc(node.x, node.y, radius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = (selectedNode && selectedNode.id === node.id) ? '#ffff00' : '#111';
                ctx.lineWidth = (selectedNode && selectedNode.id === node.id) ? 5 : 3;
                ctx.stroke();
                
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(Math.round(node.reserves), node.x, node.y - 7);
                
                ctx.fillStyle = '#ffdd44';
                ctx.font = 'bold 12px Arial';
                ctx.fillText(Math.round(node.savings), node.x, node.y + 14);
                
                ctx.fillStyle = node.savingsRate > 0 ? '#aaccff' : '#88ff88';
                ctx.font = '9px Arial';
                ctx.fillText((node.savingsRate * 100).toFixed(0) + '%', node.x, node.y + 39);
            }
        }

        function getNodeAt(x, y) {
            for (let node of nodes) {
                const dx = node.x - x;
                const dy = node.y - y;
                if (dx*dx + dy*dy < 48*48) return node;
            }
            return null;
        }

        function setupListeners() {
            document.getElementById('stepBtn').addEventListener('click', () => simulationStep());
            
            const runBtn = document.getElementById('runBtn');
            runBtn.addEventListener('click', () => {
                isRunning = !isRunning;
                runBtn.textContent = isRunning ? 'Pause' : 'Run';
                if (isRunning) intervalId = setInterval(simulationStep, 240);
                else clearInterval(intervalId);
            });
            
            document.getElementById('resetBtn').addEventListener('click', () => {
                if (isRunning) { 
                    isRunning = false; 
                    document.getElementById('runBtn').textContent = 'Run'; 
                    clearInterval(intervalId); 
                }
                step = 0;
                document.getElementById('stepCount').textContent = '0';
                createNodes();
                draw();
            });
            
            document.getElementById('randomizeBtn').addEventListener('click', () => {
                if (isRunning) { 
                    isRunning = false; 
                    document.getElementById('runBtn').textContent = 'Run'; 
                    clearInterval(intervalId); 
                }
                randomizeMoney();
                step = 0;
                document.getElementById('stepCount').textContent = '0';
                activeSenders.clear();
                draw();
            });
            
            const slider = document.getElementById('savingsSlider');
            const savingsValue = document.getElementById('savingsValue');
            slider.addEventListener('input', () => savingsValue.textContent = slider.value + '%');
            
            document.getElementById('applySavingsBtn').addEventListener('click', () => {
                const rate = parseFloat(slider.value) / 100;
                for (let node of nodes) node.savingsRate = rate;
                draw();
            });
            
            canvas.addEventListener('click', (e) => {
                const rect = canvas.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;
                
                selectedNode = getNodeAt(clickX, clickY);
                if (selectedNode) {
                    const total = selectedNode.reserves + selectedNode.savings;
                    document.getElementById('info').innerHTML = `
                        <strong>Family #${selectedNode.id}</strong><br>
                        Savings rate: <strong>${(selectedNode.savingsRate*100).toFixed(0)}%</strong><br>
                        Liquid reserves: <strong style="color:#fff">${selectedNode.reserves.toFixed(1)}</strong><br>
                        Locked savings: <strong style="color:#ffdd44">${selectedNode.savings.toFixed(1)}</strong><br>
                        <strong>Total: ${total.toFixed(1)}</strong><br><br>
                        <strong>Income / Distributed last step:</strong> <span style="color:#44ff88">${selectedNode.lastDistributed}</span><br>
                        Connections: ${selectedNode.neighbors.size} (active this step: ${activeSenders.has(selectedNode.id) ? 'YES' : 'NO'})
                    `;
                } else {
                    document.getElementById('info').innerHTML = 'Click any node for details including income/distribution.';
                }
                draw();
            });
        }

        function init() {
            createNodes();
            setupListeners();
            draw();
        }
        
        window.onload = init;
    </script>
</body>
</html>
