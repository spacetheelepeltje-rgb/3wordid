<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Graph - Fixed Edge Length</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: Arial, sans-serif; }
        canvas { display: block; }
        .controls {
            position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.95);
            padding: 15px 20px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 100; color: #222; min-width: 280px;
        }
        button { margin-top: 12px; padding: 12px; background: #0066cc; color: white; border: none; border-radius: 6px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="controls">
        <h2>3D Graph Visualizer</h2>
        <label>Nodes: <input id="numNodes" type="number" value="50" min="10" max="200"></label>
        <label>Edges per node: <input id="degree" type="number" value="4" min="2" max="12"></label>
        <button onclick="generateGraph()">Generate New Graph</button>
        <div id="stats"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let nodeMeshes = [], edgeLines = [], labelSprites = [];

        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x112233);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 40, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Lights
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const light = new THREE.DirectionalLight(0xffffff, 0.8);
            light.position.set(50, 80, 50);
            scene.add(light);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // ==================== YOUR REQUESTED CHANGES ====================

        const EDGE_LENGTH = 18;           // ← Fixed edge length (change this value)

        function generateGraph() {
            // Clear old objects
            nodeMeshes.forEach(m => scene.remove(m));
            edgeLines.forEach(l => scene.remove(l));
            labelSprites.forEach(s => scene.remove(s));
            nodeMeshes = []; edgeLines = []; labelSprites = [];

            const N = parseInt(document.getElementById('numNodes').value) || 50;
            const targetDegree = parseInt(document.getElementById('degree').value) || 4;

            // Node data
            const nodes = [];
            for (let i = 0; i < N; i++) {
                nodes.push({
                    id: i + 1,
                    position: new THREE.Vector3(
                        (Math.random()-0.5)*40,
                        (Math.random()-0.5)*40,
                        (Math.random()-0.5)*40
                    )
                });
            }

            // === Build graph with approximately fixed edge length ===
            const edges = new Set();
            const adjacency = Array.from({length: N}, () => []);

            for (let i = 0; i < N; i++) {
                while (adjacency[i].length < targetDegree) {
                    let j = Math.floor(Math.random() * N);
                    if (i === j) continue;
                    const key = i < j ? `${i}-${j}` : `${j}-${i}`;
                    if (!edges.has(key)) {
                        edges.add(key);
                        adjacency[i].push(j);
                        adjacency[j].push(i);
                    }
                }
            }

            // === Create smaller nodes ===
            const nodeGeo = new THREE.SphereGeometry(0.8, 24, 24);   // ← Smaller nodes (was 1.5)
            const nodeMat = new THREE.MeshPhongMaterial({ color: 0x44ddff, shininess: 30 });

            for (let i = 0; i < N; i++) {
                const mesh = new THREE.Mesh(nodeGeo, nodeMat);
                mesh.position.copy(nodes[i].position);
                scene.add(mesh);
                nodeMeshes.push(mesh);

                // Number label
                const sprite = createLabel(nodes[i].id.toString());
                sprite.position.copy(nodes[i].position);
                sprite.position.y += 2.5;
                scene.add(sprite);
                labelSprites.push(sprite);
            }

            // === Create edges with fixed length ===
            const lineMat = new THREE.LineBasicMaterial({ color: 0xaaddff, opacity: 0.7, transparent: true });

            for (let key of edges) {
                const [i, j] = key.split('-').map(Number);
                
                const p1 = nodes[i].position;
                const p2 = nodes[j].position;

                // Force fixed edge length by moving second point
                const direction = new THREE.Vector3().subVectors(p2, p1).normalize();
                const fixedP2 = p1.clone().add(direction.multiplyScalar(EDGE_LENGTH));

                nodes[j].position.copy(fixedP2);   // Update position to keep fixed length

                const geo = new THREE.BufferGeometry().setFromPoints([p1, fixedP2]);
                const line = new THREE.Line(geo, lineMat);
                scene.add(line);
                edgeLines.push(line);
            }

            document.getElementById('stats').innerHTML = 
                `<b>${N} nodes</b> • <b>${edges.size} edges</b> • Edge length = ${EDGE_LENGTH}`;
        }

        function createLabel(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 52px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 64, 36);

            const tex = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex }));
            sprite.scale.set(7, 3.5, 1);
            return sprite;
        }

        // ==================== CAMERA CONTROLS (free rotation) ====================
        let isDragging = false, prevX = 0, prevY = 0;

        function setupControls() {
            const canvas = renderer.domElement;

            canvas.addEventListener('mousedown', e => {
                if (e.button === 0) isDragging = true;
                prevX = e.clientX; prevY = e.clientY;
            });

            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', e => {
                if (!isDragging) return;

                const deltaX = (e.clientX - prevX) * 0.005;
                const deltaY = (e.clientY - prevY) * 0.005;

                const dist = camera.position.length();
                let theta = Math.atan2(camera.position.x, camera.position.z);
                let phi = Math.acos(camera.position.y / dist);

                theta += deltaX;
                phi = Math.max(0.1, Math.min(Math.PI - 0.1, phi + deltaY));

                camera.position.x = dist * Math.sin(phi) * Math.sin(theta);
                camera.position.z = dist * Math.sin(phi) * Math.cos(theta);
                camera.position.y = dist * Math.cos(phi);
                camera.lookAt(0, 0, 0);

                prevX = e.clientX; prevY = e.clientY;
            });

            // Zoom
            window.addEventListener('wheel', e => {
                let dist = camera.position.length();
                dist = Math.max(30, Math.min(300, dist + e.deltaY * 0.2));
                camera.position.normalize().multiplyScalar(dist);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        // Start
        window.onload = () => {
            initThree();
            setupControls();
            generateGraph();
            animate();
        };
    </script>
</body>
</html>
