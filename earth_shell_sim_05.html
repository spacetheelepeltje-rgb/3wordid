<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Earth Sunshade - Dawn-Dusk SSO Satellite Constellation</title>
<style>
  body { margin:0; overflow:hidden; background:#000; font-family:Arial, sans-serif; }
  
  #controls {
    position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
    color: white; background: rgba(0,0,0,0.85); padding: 18px 25px;
    border-radius: 12px; display: flex; align-items: center; gap: 20px;
    z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
  }
  #controls label { font-size: 16px; font-weight: bold; }
  #controls input { width: 130px; padding: 10px; font-size: 16px; border-radius: 6px; }
  #controls button {
    padding: 12px 22px; font-size: 16px; font-weight: bold;
    background: #00aaff; color: white; border: none; border-radius: 6px; cursor: pointer;
  }
  #controls button:hover { background: #00ccff; }

  #info {
    position: absolute; top: 80px; left: 20px; color: white; 
    background: rgba(0,0,0,0.65); padding: 12px; border-radius: 8px; 
    font-size: 14px; pointer-events: none;
  }
</style>
</head>
<body>

<div id="controls">
  <label>Number of Satellites:</label>
  <input type="number" id="satInput" value="48">
  
  <button onclick="updateSatellites()">Update Constellation</button>
  <button onclick="toggleRotation()">Pause Rotation</button>
</div>

<div id="info">
  <strong>Earth Sunshade — Dawn-Dusk Sun-Synchronous Orbit (SSO)</strong><br>
  <span id="stats"></span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>

<script>
// ============== CONFIG ==============
const EARTH_RADIUS_KM = 6371;
const SAT_ALTITUDE_KM = 700;

const SCALE = 0.001;
const EARTH_RADIUS = EARTH_RADIUS_KM * SCALE;
const SAT_RADIUS = (EARTH_RADIUS_KM + SAT_ALTITUDE_KM) * SCALE;

let numSatellites = 48;
let rotating = true;

// ============== THREE.JS SETUP ==============
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 10, 25);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// === Strong Directional Sun (Sunny side) ===
const sunLight = new THREE.DirectionalLight(0xffffff, 1.65);
sunLight.position.set(150, 60, 90);   // Clear sun direction
scene.add(sunLight);

scene.add(new THREE.AmbientLight(0x304060, 0.4)); // Soft night side fill

// ============== EARTH (Well Illuminated) ==============
const earth = new THREE.Mesh(
  new THREE.SphereGeometry(EARTH_RADIUS, 96, 96),
  new THREE.MeshPhongMaterial({ 
    color: 0x1e4a8f,
    shininess: 15,
    specular: 0x222222
  })
);
scene.add(earth);

// Subtle land tint
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(EARTH_RADIUS * 1.003, 96, 96),
  new THREE.MeshPhongMaterial({ 
    color: 0x2a5c2a, 
    transparent: true, 
    opacity: 0.28,
    shininess: 5
  })
));

// Atmosphere glow
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(EARTH_RADIUS * 1.025, 64, 64),
  new THREE.MeshPhongMaterial({ 
    color: 0x88ccff, 
    transparent: true, 
    opacity: 0.15, 
    side: THREE.BackSide 
  })
));

// ============== SATELLITES GROUP ==============
let satelliteGroup = new THREE.Group();
scene.add(satelliteGroup);

function createSatellites() {
  satelliteGroup.clear();

  const points = [];
  const golden = Math.PI * (3 - Math.sqrt(5));

  // Dawn-Dusk SSO: satellites positioned near the terminator plane (sun-Earth perpendicular)
  for (let i = 0; i < numSatellites; i++) {
    const t = i / numSatellites;
    const angle = t * Math.PI * 2;
    
    // Flatten orbit along terminator (sunny/shadow boundary)
    const x = Math.cos(angle) * SAT_RADIUS * 1.02;     // main spread
    const y = Math.sin(angle * 1.8) * SAT_RADIUS * 0.45; // slight polar tilt
    const z = Math.sin(angle) * SAT_RADIUS * 0.25;     // compressed toward sun direction

    points.push(new THREE.Vector3(x, y, z));
  }

  // Satellites
  const satGeo = new THREE.SphereGeometry(0.042, 12, 12);
  const satMat = new THREE.MeshPhongMaterial({ 
    color: 0xffee44, 
    emissive: 0xffcc00, 
    emissiveIntensity: 1.1,
    shininess: 30
  });

  const sats = new THREE.InstancedMesh(satGeo, satMat, numSatellites);
  const dummy = new THREE.Object3D();

  points.forEach((p, i) => {
    dummy.position.copy(p);
    dummy.lookAt(0, 0, 0);
    dummy.updateMatrix();
    sats.setMatrixAt(i, dummy.matrix);
  });
  satelliteGroup.add(sats);

  // Connect nearby satellites with edges for clarity
  const connections = [];
  const maxDist = SAT_RADIUS * 0.35;

  for (let i = 0; i < numSatellites; i++) {
    for (let j = i + 1; j < numSatellites; j++) {
      if (points[i].distanceTo(points[j]) < maxDist) {
        connections.push(points[i]);
        connections.push(points[j]);
      }
    }
  }

  const lineGeo = new THREE.BufferGeometry().setFromPoints(connections);
  const lineMat = new THREE.LineBasicMaterial({ 
    color: 0x88ffcc, 
    transparent: true, 
    opacity: 0.6 
  });
  satelliteGroup.add(new THREE.LineSegments(lineGeo, lineMat));

  document.getElementById('stats').innerHTML = `
    Altitude: 700 km (Dawn-Dusk SSO)<br>
    Satellites: ${numSatellites}<br>
    Connections: ${(connections.length/2).toLocaleString()}<br>
    Purpose: Conceptual Sunshade Constellation
  `;
}

// ============== ANIMATION ==============
function animate() {
  requestAnimationFrame(animate);
  controls.update();

  if (rotating) {
    const speed = 0.0004;
    earth.rotation.y += speed;
    satelliteGroup.rotation.y += speed * 0.92; // near-synchronous with sun for SSO effect
  }

  renderer.render(scene, camera);
}
animate();

// ============== CONTROLS ==============
window.updateSatellites = function() {
  numSatellites = parseFloat(document.getElementById('satInput').value) || 48;
  numSatellites = Math.max(12, Math.min(numSatellites, 360));
  createSatellites();
};

window.toggleRotation = function() {
  rotating = !rotating;
  const btn = document.querySelectorAll('#controls button')[1];
  btn.textContent = rotating ? "Pause Rotation" : "Resume Rotation";
};

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Initial
createSatellites();
</script>
</body>
</html>
