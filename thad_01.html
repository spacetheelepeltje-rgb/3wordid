<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Figure-Eight Knot (4₁) with Crossings</title>
  <style>
    body { margin:0; overflow:hidden; background:#000; }
    canvas { display:block; }
    #info {
      position: absolute; top: 10px; left: 10px; color: #0cf; font-family: Arial, sans-serif;
      background: rgba(0,0,0,0.7); padding: 12px; border-radius: 8px; pointer-events: none; z-index: 10;
    }
  </style>
</head>
<body>
<div id="info">
  <strong>Figure-Eight Knot (4₁)</strong><br>
  Minimal hyperbolic volume ≈ 2.02988<br><br>
  Drag to rotate • Scroll to zoom
</div>

<canvas id="canvas"></canvas>

<script>
// =============== Figure-Eight Knot with Crossings ===============
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width, height, cx, cy;
let rotation = 0;
let zoom = 220;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  cx = width / 2;
  cy = height / 2;
}
resize();
window.addEventListener('resize', resize);

// Mouse controls
let dragging = false, prevX = 0;
canvas.addEventListener('mousedown', e => { dragging = true; prevX = e.clientX; });
window.addEventListener('mouseup', () => dragging = false);
window.addEventListener('mousemove', e => {
  if (dragging) {
    rotation += (e.clientX - prevX) * 0.006;
    prevX = e.clientX;
  }
});
canvas.addEventListener('wheel', e => {
  zoom = Math.max(80, Math.min(500, zoom - e.deltaY * 0.3));
  e.preventDefault();
});

function getPoint(t, rot) {
  const x = (2 + Math.cos(2*t)) * Math.cos(t);
  const y = (2 + Math.cos(2*t)) * Math.sin(t);
  const z = Math.sin(2*t) * 1.1;
  
  const rx = x * Math.cos(rot) - z * Math.sin(rot);
  const rz = x * Math.sin(rot) + z * Math.cos(rot);
  
  return {
    x: rx * zoom,
    y: y * zoom * 0.85 - rz * 35,
    z: rz   // for depth
  };
}

function drawKnot() {
  ctx.fillStyle = '#0a0a1f';
  ctx.fillRect(0, 0, width, height);

  ctx.save();
  ctx.translate(cx, cy);

  const steps = 480;
  const points = [];
  for (let i = 0; i <= steps; i++) {
    const t = (i / steps) * Math.PI * 4;
    points.push(getPoint(t, rotation));
  }

  // Draw under strands first (thinner, darker)
  ctx.strokeStyle = '#006688';
  ctx.lineWidth = 11;
  ctx.lineCap = 'round';
  ctx.shadowBlur = 0;
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const p = points[i];
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();

  // Draw over strands (brighter, with gaps at crossings for clarity)
  ctx.strokeStyle = '#00ddff';
  ctx.lineWidth = 13;
  ctx.shadowBlur = 25;
  ctx.shadowColor = '#0ff';

  ctx.beginPath();
  let skip = false;
  for (let i = 0; i <= steps; i++) {
    const p = points[i];
    const next = points[(i+1) % points.length];
    
    // Rough crossing detection (z-depth change)
    if (Math.abs(p.z - next.z) > 0.8 && !skip) {
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      skip = true;
    } else if (skip && Math.abs(p.z - next.z) < 0.4) {
      skip = false;
    }
    
    if (!skip) {
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
  }
  ctx.stroke();

  ctx.restore();

  // Bottom text
  ctx.fillStyle = 'rgba(200,240,255,0.7)';
  ctx.font = '14px Arial';
  ctx.fillText('Classic projection with over/under crossings • Drag to rotate', 20, height - 20);
}

function loop() {
  drawKnot();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
