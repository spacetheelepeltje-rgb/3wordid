<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closed Family Enterprise Network</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
        canvas { background: white; border: 2px solid #333; box-shadow: 0 0 10px rgba(0,0,0,0.1); display: block; margin: 0 auto; }
        .controls { margin: 15px auto; padding: 15px; background: white; border-radius: 8px; max-width: 900px;
                    display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        button { padding: 9px 18px; font-size: 14px; cursor: pointer; }
        #info { margin: 10px auto; padding: 12px; background: #fff; border: 1px solid #ddd; border-radius: 6px; 
                max-width: 900px; min-height: 170px; line-height: 1.5; }
    </style>
</head>
<body>
    <h1>Closed Family Enterprise Network (Fixed 10,000)</h1>
    <p class="description">Families act as companies. Savings = profit taking. Total money is conserved.</p>
    
    <div class="controls">
        <button id="stepBtn">Step</button>
        <button id="runBtn">Run / Pause</button>
        <button id="resetBtn">Reset Simulation</button>
        <button id="randomizeBtn">Randomize Money</button>
        
        <label>Savings Rate: 
            <input type="range" id="savingsSlider" min="0" max="100" value="25">
            <span id="savingsValue">25%</span>
        </label>
        <button id="applySavingsBtn">Apply to All</button>
        
        <span>Step: <span id="stepCount">0</span></span>
        <span>Liquid: <span id="totalLiquid">10000</span></span>
        <span>Savings: <span id="totalSavings">0</span></span>
        <span>Grand Total: <span id="grandTotal">10000</span></span>
    </div>

    <canvas id="canvas" width="850" height="650"></canvas>
    <div id="info">Click any node for details.</div>

    <script>
        // ====================== EDITABLE CONSTANTS ======================
        const TOTAL_MONEY = 10000;
        const GRID_SIZE = 5;
        const NUM_NODES = GRID_SIZE * GRID_SIZE;
        const MIN_CONNECTIONS = 10;
        
        const BANKRUPTCY_THRESHOLD = 40;           // Total wealth below this → bankruptcy
        const EMERGENCY_WITHDRAW = 45;             // How much they can take from savings when desperate
        const STARTING_MIN_RESERVES = 80;

        // ====================== STATE ======================
        let nodes = [];
        let step = 0;
        let isRunning = false;
        let intervalId = null;
        let selectedNode = null;
        let activeSenders = new Set();

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // ====================== SETUP ======================
        function createNodes() {
            nodes = [];
            const rate = parseFloat(document.getElementById('savingsSlider').value) / 100;
            const cellSize = 110;
            const offsetX = 80;
            const offsetY = 60;

            for (let i = 0; i < NUM_NODES; i++) {
                const row = Math.floor(i / GRID_SIZE);
                const col = i % GRID_SIZE;
                nodes.push({
                    id: i,
                    x: offsetX + col * cellSize,
                    y: offsetY + row * cellSize,
                    savingsRate: rate,
                    reserves: 0,
                    savings: 0,
                    lastDistributed: 0,
                    isBankrupt: false,
                    neighbors: new Set()
                });
            }
            createConnections();
            randomizeMoney();
        }

        function createConnections() {
            nodes.forEach(n => n.neighbors.clear());
            for (let i = 0; i < NUM_NODES; i++) {
                while (nodes[i].neighbors.size < MIN_CONNECTIONS) {
                    const j = Math.floor(Math.random() * NUM_NODES);
                    if (j !== i && !nodes[i].neighbors.has(j)) {
                        nodes[i].neighbors.add(j);
                        nodes[j].neighbors.add(i);
                    }
                }
            }
        }

        function randomizeMoney() {
            nodes.forEach(n => { n.reserves = 0; n.savings = 0; n.isBankrupt = false; });
            
            const base = TOTAL_MONEY / NUM_NODES;
            nodes.forEach(node => {
                const variation = (Math.random() - 0.5) * 260;
                node.reserves = Math.max(STARTING_MIN_RESERVES, Math.round(base + variation));
            });

            // Force exact total
            let current = nodes.reduce((sum, n) => sum + n.reserves, 0);
            const adjustment = Math.round((TOTAL_MONEY - current) / NUM_NODES);
            nodes.forEach(n => n.reserves += adjustment);
        }

        // ====================== SIMULATION CORE ======================
        function simulationStep() {
            step++;
            document.getElementById('stepCount').textContent = step;
            activeSenders.clear();

            const received = new Array(NUM_NODES).fill(0);

            for (let i = 0; i < NUM_NODES; i++) {
                const node = nodes[i];
                node.lastDistributed = 0;

                if (node.isBankrupt) continue;

                const totalWealth = node.reserves + node.savings;
                if (totalWealth < BANKRUPTCY_THRESHOLD) {
                    node.isBankrupt = true;
                    continue;
                }

                if (node.reserves > 1) {
                    activeSenders.add(i);

                    // === Profit Taking ===
                    const profit = node.reserves * node.savingsRate;
                    node.savings += profit;

                    // === Circulate the rest ===
                    const toCirculate = node.reserves * (1 - node.savingsRate);
                    if (toCirculate > 1 && node.neighbors.size > 0) {
                        const share = toCirculate / node.neighbors.size;
                        for (let neigh of node.neighbors) {
                            received[neigh] += share;
                        }
                        node.lastDistributed = Math.round(toCirculate);
                    }
                    node.reserves = 0;
                }

                // === Emergency survival (very limited) ===
                if (node.reserves < 5 && node.savings > 0) {
                    const withdraw = Math.min(EMERGENCY_WITHDRAW, node.savings);
                    node.savings -= withdraw;
                    node.reserves += withdraw;
                }
            }

            // Apply received money
            let totalLiquid = 0;
            let totalSavings = 0;

            for (let i = 0; i < NUM_NODES; i++) {
                nodes[i].reserves += received[i];
                totalLiquid += nodes[i].reserves;
                totalSavings += nodes[i].savings;
            }

            document.getElementById('totalLiquid').textContent = Math.round(totalLiquid);
            document.getElementById('totalSavings').textContent = Math.round(totalSavings);
            document.getElementById('grandTotal').textContent = Math.round(totalLiquid + totalSavings);

            draw();
        }

        // ====================== DRAWING ======================
        function draw() {
            ctx.clearRect(0, 0, 850, 650);

            // Active connections
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 1.4;
            for (let i of activeSenders) {
                const n = nodes[i];
                for (let j of n.neighbors) {
                    if (j > i || !activeSenders.has(j)) {
                        ctx.beginPath();
                        ctx.moveTo(n.x, n.y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.stroke();
                    }
                }
            }

            let maxWealth = Math.max(...nodes.map(n => n.reserves + n.savings));

            for (let node of nodes) {
                const wealth = node.reserves + node.savings;
                const radius = 29 + (wealth / maxWealth) * 14;

                let color = '#1e3a8a'; // normal dark blue
                if (node.isBankrupt) color = '#aa0000';
                else if (node.reserves <= 0) color = '#223355';

                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(node.x, node.y, radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = (selectedNode?.id === node.id) ? '#ffff00' : '#111';
                ctx.lineWidth = (selectedNode?.id === node.id) ? 5 : 3;
                ctx.stroke();

                // Numbers
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(Math.round(node.reserves), node.x, node.y - 8);

                ctx.fillStyle = '#ffdd44';
                ctx.font = 'bold 12px Arial';
                ctx.fillText(Math.round(node.savings), node.x, node.y + 13);

                ctx.fillStyle = '#aaccff';
                ctx.font = '9px Arial';
                ctx.fillText((node.savingsRate*100).toFixed(0)+'%', node.x, node.y + 38);
            }
        }

        // ====================== UI ======================
        function getNodeAt(x, y) {
            for (let node of nodes) {
                const dx = node.x - x, dy = node.y - y;
                if (dx*dx + dy*dy < 50*50) return node;
            }
            return null;
        }

        function setupListeners() {
            // ... (same clean listeners as previous versions)
            // I'll keep it short here — you already have them working
            document.getElementById('stepBtn').onclick = simulationStep;
            
            const runBtn = document.getElementById('runBtn');
            runBtn.onclick = () => {
                isRunning = !isRunning;
                runBtn.textContent = isRunning ? 'Pause' : 'Run';
                if (isRunning) intervalId = setInterval(simulationStep, 220);
                else clearInterval(intervalId);
            };

            document.getElementById('resetBtn').onclick = () => {
                if (isRunning) { isRunning = false; document.getElementById('runBtn').textContent = 'Run'; clearInterval(intervalId); }
                step = 0; document.getElementById('stepCount').textContent = '0';
                createNodes();
                draw();
            };

            document.getElementById('randomizeBtn').onclick = () => {
                if (isRunning) { isRunning = false; document.getElementById('runBtn').textContent = 'Run'; clearInterval(intervalId); }
                randomizeMoney();
                step = 0; document.getElementById('stepCount').textContent = '0';
                draw();
            };

            // Slider + Apply
            const slider = document.getElementById('savingsSlider');
            document.getElementById('savingsValue').textContent = slider.value + '%';
            slider.oninput = () => document.getElementById('savingsValue').textContent = slider.value + '%';

            document.getElementById('applySavingsBtn').onclick = () => {
                const rate = parseFloat(slider.value) / 100;
                nodes.forEach(n => n.savingsRate = rate);
                draw();
            };

            canvas.onclick = (e) => {
                const rect = canvas.getBoundingClientRect();
                selectedNode = getNodeAt(e.clientX - rect.left, e.clientY - rect.top);
                if (selectedNode) {
                    const t = selectedNode.reserves + selectedNode.savings;
                    document.getElementById('info').innerHTML = `
                        <strong>Family #${selectedNode.id} ${selectedNode.isBankrupt ? '(BANKRUPT)' : ''}</strong><br>
                        Savings rate: ${ (selectedNode.savingsRate*100).toFixed(0) }%<br>
                        Liquid reserves: <strong style="color:#fff">${selectedNode.reserves.toFixed(1)}</strong><br>
                        Savings (profit): <strong style="color:#ffdd44">${selectedNode.savings.toFixed(1)}</strong><br>
                        <strong>Total wealth: ${t.toFixed(1)}</strong><br>
                        Distributed last step: <strong>${selectedNode.lastDistributed}</strong>
                    `;
                }
                draw();
            };
        }

        function init() {
            createNodes();
            setupListeners();
            draw();
        }

        window.onload = init;
    </script>
</body>
</html>
